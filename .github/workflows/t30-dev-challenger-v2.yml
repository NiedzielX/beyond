name: T30 Development Challenger v2

on:
  pull_request:
    paths:
      - "ml/t30_dev_challenger_v2.py"
      - ".github/workflows/t30-dev-challenger-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-development-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile challenger
        run: python -m py_compile ml/t30_dev_challenger_v2.py

      - name: Run T-30 development-only search
        run: |
          python -m ml.t30_dev_challenger_v2 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/t30-dev-challenger-v2.json

      - name: Print candidate decision summary
        run: |
          jq '{experiment,governance,rows,numeric_feature_count,baseline_mae,current_champion_dev_mae,best,top_15}' \
            /tmp/t30-dev-challenger-v2.json
