name: ML Research Readiness Contract v1

on:
  workflow_dispatch:
    inputs:
      public_source_audit:
        description: 'Fetch fixed public attendance-source pages without model or database operations'
        type: boolean
        default: false
  pull_request:
    paths:
      - "supabase/sql/ml_research_readiness_v1.sql"
      - "supabase/sql/p4_fixture_context_precommit_v1.sql"
      - "ml/results/ML_RESEARCH_READINESS_V1_2026-10-23.md"
      - ".github/workflows/ml-research-readiness-contract-v1.yml"
  push:
    branches: [main]
    paths:
      - "supabase/sql/ml_research_readiness_v1.sql"
      - "supabase/sql/p4_fixture_context_precommit_v1.sql"
      - "ml/results/ML_RESEARCH_READINESS_V1_2026-10-23.md"
      - ".github/workflows/ml-research-readiness-contract-v1.yml"

permissions:
  contents: read

jobs:
  public-source-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.public_source_audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded extraction and URL whitelist
        run: python -m unittest ml.test_public_attendance_source_audit_v1 -v
      - name: Fetch public sources and expose structured read-only check evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ml.public_attendance_source_audit_v1 --output-dir "$RUNNER_TEMP/public-attendance-sources" --publish-checks
      - name: Preserve raw public-source receipts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-attendance-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/public-attendance-sources
          retention-days: 14
          if-no-files-found: ignore
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify objective readiness gates
        run: |
          set -euo pipefail
          f='supabase/sql/ml_research_readiness_v1.sql'
          p4='supabase/sql/p4_fixture_context_precommit_v1.sql'
          test -f "$f"
          test -f "$p4"
          grep -q "research_start_threshold',9" "$f"
          grep -q "v_events_gt_72 >= 9" "$f"
          grep -q "v_long72_scored >= 1" "$f"
          grep -q "P4_PREVIOUS_HOME_SPACING_START" "$f"
          grep -q "v_p4_prev_start" "$f"
          grep -q "v_opponent_ready >= 1" "$f"
          grep -q "manual_first_checkpoint" "$f"
          grep -q "production_change',false" "$f"
          grep -q "freeze exact event/as_of identities" "$f"
          grep -q "research_start_threshold_events',9" "$p4"
          grep -q "minimum_distinct_values',3" "$p4"
          grep -q "targetFieldsIncluded',false" "$p4"
          grep -q "labelsIncluded',false" "$p4"
