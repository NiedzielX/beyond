name: Trajectory Lane B v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/run_trajectory_lane_b_v2.py"
      - "ml/demand_engine/trajectory_lane_b_v2.py"
      - "ml/TRAJECTORY_LANE_B_V2_PRECOMMIT.md"
      - ".github/workflows/trajectory-lane-b-v2.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: trajectory-lane-b-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile frozen v2 diagnostic
        run: |
          python -m py_compile ml/demand_engine/trajectory_lane_b_v1.py
          python -m py_compile ml/demand_engine/trajectory_lane_b_v2.py
          python -m py_compile ml/run_trajectory_lane_b_v1.py
          python -m py_compile ml/run_trajectory_lane_b_v2.py

      - name: Request trajectory research OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-trajectory-research")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "TRAJECTORY_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Fetch exact frozen development export
        shell: bash
        run: |
          set -euo pipefail
          event_ids=$(jq -c '[.events[].ticket_event_id]' ml/artifacts/trajectory_development_cohort_v1.json)
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $TRAJECTORY_OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"event_ids\":${event_ids}}" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/trajectory_research_export_v1' \
            -o /tmp/trajectory-development-export-v1.json
          jq -e '.ok == true' /tmp/trajectory-development-export-v1.json >/dev/null
          test "$(jq -r '.event_count' /tmp/trajectory-development-export-v1.json)" = "10"
          test "$(jq -r '.row_count' /tmp/trajectory-development-export-v1.json)" = "19"

      - name: Run frozen Lane B v2 diagnostic
        run: |
          python -m ml.run_trajectory_lane_b_v2 \
            --input /tmp/trajectory-development-export-v1.json \
            --cohort ml/artifacts/trajectory_development_cohort_v1.json \
            --lane-a-result ml/results/trajectory_lane_a_ridge_residual_v1_result.json \
            --lane-b-v1-result ml/results/trajectory_lane_b_small_gru_residual_v1_result.json \
            --output /tmp/trajectory-lane-b-v2-result.json

      - name: Print diagnostic summary
        run: |
          jq '{version,evidence_class,independent_test_events,incumbent_event_balanced_mae,lane_b_v1_event_balanced_mae,lane_b_v2_event_balanced_mae,delta_mae_vs_incumbent,delta_mae_vs_lane_b_v1,event_improvement_rate,worst_event_degradation,predicted_residual_ratio_distribution,predicted_seat_residual_distribution,median_seed_ratio_spread,max_seed_ratio_spread,by_horizon}' \
            /tmp/trajectory-lane-b-v2-result.json

      - name: Upload Lane B v2 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-lane-b-v2-${{ github.run_id }}
          path: /tmp/trajectory-lane-b-v2-result.json
          if-no-files-found: error
          retention-days: 90
