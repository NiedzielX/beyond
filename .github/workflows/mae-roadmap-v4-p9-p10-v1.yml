name: MAE Roadmap v4 P9 P10 v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/MAE_RESEARCH_ROADMAP_V4.md"
      - "ml/research_advance_governance_v2.py"
      - "ml/test_research_advance_governance_v2.py"
      - "ml/p9_booking_curve_v1.py"
      - "ml/test_p9_booking_curve_v1.py"
      - "ml/p10_reconstruct_feature_store_v1.py"
      - "ml/p10_pooled_horizon_global_v1.py"
      - "ml/test_p10_pooled_horizon_global_v1.py"
      - "ml/P11_MATCH_ATTRACTIVENESS_CONTEXT_V1_PLAN.md"
      - "ml/results/P9_BOOKING_CURVE_PRECOMMIT_V1_2026-10-23.md"
      - "ml/results/P10_POOLED_HORIZON_PRECOMMIT_V1_2026-10-23.md"
      - ".github/workflows/mae-roadmap-v4-p9-p10-v1.yml"
  push:
    branches:
      - main
      - ml/mae-roadmap-v4-p9-p10-v1
    paths:
      - "ml/MAE_RESEARCH_ROADMAP_V4.md"
      - "ml/research_advance_governance_v2.py"
      - "ml/test_research_advance_governance_v2.py"
      - "ml/p9_booking_curve_v1.py"
      - "ml/test_p9_booking_curve_v1.py"
      - "ml/p10_reconstruct_feature_store_v1.py"
      - "ml/p10_pooled_horizon_global_v1.py"
      - "ml/test_p10_pooled_horizon_global_v1.py"
      - "ml/P11_MATCH_ATTRACTIVENESS_CONTEXT_V1_PLAN.md"
      - "ml/results/P9_BOOKING_CURVE_PRECOMMIT_V1_2026-10-23.md"
      - "ml/results/P10_POOLED_HORIZON_PRECOMMIT_V1_2026-10-23.md"
      - ".github/workflows/mae-roadmap-v4-p9-p10-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ML dependencies
        run: pip install -r ml/requirements.txt
      - name: Compile new MAE-first modules
        run: |
          python -m py_compile ml/research_advance_governance_v2.py
          python -m py_compile ml/p9_booking_curve_v1.py
          python -m py_compile ml/p10_reconstruct_feature_store_v1.py
          python -m py_compile ml/p10_pooled_horizon_global_v1.py
      - name: Run governance v2 tests
        run: python -m ml.test_research_advance_governance_v2
      - name: Run P9 booking-curve PIT tests
        run: python -m ml.test_p9_booking_curve_v1
      - name: Run P10 pooled-horizon tests
        run: python -m ml.test_p10_pooled_horizon_global_v1
      - name: Verify roadmap v4 contract
        run: |
          set -euo pipefail
          f=ml/MAE_RESEARCH_ROADMAP_V4.md
          grep -q "P9 — Booking Curve / Trajectory Shape" "$f"
          grep -q "P10 — Pooled Horizon Global Model" "$f"
          grep -q "P11 — Match Attractiveness / Commercial Context" "$f"
          grep -q "Governance v2 — Minimum Meaningful Improvement" "$f"
          grep -q "POINT_GAIN_UNCERTAINTY_LIMITED" "$f"
          grep -q "ROBUST_RESEARCH_ADVANCE" "$f"
          grep -q 'live_adjustment = 0' "$f"

  real-p10:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ML dependencies
        run: pip install -r ml/requirements.txt
      - name: Reconstruct canonical 7,650-row PIT feature store
        run: |
          python -m ml.p10_reconstruct_feature_store_v1 \
            --raw-history ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/p10-feature-store.csv.gz \
            --report /tmp/p10-feature-store-report.json
          jq -e '
            .status == "PASS"
            and .raw_sha256 == "3c6b35142c6bd20a484f2aa758cd41284fd6f4c6db1353b138f81cf321161569"
            and .p10_rows == 7650
            and .p10_matches == 1530
            and .baseline_fixed_source == "baseline_season"
          ' /tmp/p10-feature-store-report.json >/dev/null
      - name: Run real pooled-vs-local P10 benchmark
        run: |
          python -m ml.p10_pooled_horizon_global_v1 \
            --feature-store /tmp/p10-feature-store.csv.gz \
            --output-json /tmp/p10-real-scorecard.json \
            --predictions-csv /tmp/p10-real-predictions.csv \
            --fold-manifest /tmp/p10-real-folds.json
          jq -e '
            .evidence_class == "historical_exposed_research"
            and .match_blocking == true
            and .production_change == false
            and .live_adjustment == 0
            and .matches > 0
            and .fold_count >= 1
            and .governance_v2.robust_advance_allowed == false
          ' /tmp/p10-real-scorecard.json >/dev/null
      - name: Print controlled P10 result
        run: |
          jq '{matches,eligible_rows,fold_count,local_match_balanced_mae,pooled_match_balanced_mae,delta_mae,event_improvement_rate,fold_improvement_rate,governance_v2,per_horizon}' /tmp/p10-real-scorecard.json
      - name: Upload canonical P10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p10-real-evidence-${{ github.run_id }}
          path: |
            /tmp/p10-feature-store-report.json
            /tmp/p10-real-scorecard.json
            /tmp/p10-real-predictions.csv
            /tmp/p10-real-folds.json
          if-no-files-found: error
          retention-days: 90
