name: Ticketing challenger scorer I/O parity
on:
  pull_request:
    paths:
      - 'supabase/ops/ticketing_challenger_scorer_io*.sql'
      - 'ml/global/sql/ticketing_challenger_v1_scorer.sql'
      - 'tests/postgres/test_ticketing_challenger_scorer_io_v1.py'
      - '.github/workflows/ticketing-challenger-scorer-io-v1.yml'
permissions:
  contents: read
jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticketing_challenger_scorer_io_v1_test
          POSTGRES_PASSWORD: scorer-io-disposable-ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticketing_challenger_scorer_io_v1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.3.9'
      - run: python -m unittest discover -s tests/postgres -p test_ticketing_challenger_scorer_io_v1.py -v
        env:
          TICKETING_CHALLENGER_SCORER_IO_TEST_DSN: postgresql://postgres:scorer-io-disposable-ci@127.0.0.1:55440/ticketing_challenger_scorer_io_v1_test
