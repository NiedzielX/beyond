name: Structural Prior Artifact Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/demand_engine/freeze_structural_prior_artifacts.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/demand_engine/current_structural_prior_features.py"
      - "ml/demand_engine/test_current_structural_prior_features.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - ".github/workflows/structural-prior-artifacts.yml"
  pull_request:
    paths:
      - "ml/demand_engine/freeze_structural_prior_artifacts.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/demand_engine/current_structural_prior_features.py"
      - "ml/demand_engine/test_current_structural_prior_features.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - ".github/workflows/structural-prior-artifacts.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: structural-prior-artifact-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile freeze/runtime entrypoints
        run: |
          python -m py_compile ml/demand_engine/freeze_structural_prior_artifacts.py
          python -m py_compile ml/demand_engine/structural_prior_runtime.py
          python -m py_compile ml/demand_engine/current_structural_prior_features.py
          python -m py_compile ml/features/structural_prior_feature_store_v1.py

      - name: Run Structural Prior runtime contract tests
        run: |
          python -m unittest ml.demand_engine.test_structural_prior_runtime
          python -m unittest ml.demand_engine.test_current_structural_prior_features

      - name: Reproduce frozen benchmark from committed canonical history
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          source = Path("ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz")
          frame = pd.read_csv(source)
          rows = []
          for row in frame.to_dict("records"):
              rows.append({
                  "dataset_version": "committed-frozen-runtime-input",
                  "season": row["season"],
                  "round_no": int(row["round"]),
                  "match_date": row["date"],
                  "kickoff_time_local": row["kickoff_time_local"],
                  "home_team": row["home_team"],
                  "away_team": row["away_team"],
                  "home_club_key": row["home_club_key"],
                  "away_club_key": row["away_club_key"],
                  "home_goals": int(row["home_goals"]),
                  "away_goals": int(row["away_goals"]),
                  "attendance": int(row["attendance"]),
                  "default_demand_training_eligible": int(row["attendance"]) != 0,
                  "match_key": row["match_key"],
              })
          Path("/tmp/structural-prior-pr-training.json").write_text(
              json.dumps({"rows": rows}, ensure_ascii=False)
          )
          PY
          rm -rf /tmp/structural-prior-pr-artifacts
          python -m ml.demand_engine.freeze_structural_prior_artifacts \
            --input /tmp/structural-prior-pr-training.json \
            --output-dir /tmp/structural-prior-pr-artifacts
          jq '.benchmark_reproduction' /tmp/structural-prior-pr-artifacts/manifest.json

  freeze:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-structural-prior-materializer")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "BEYOND_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Fetch canonical five-season training export
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/structural_prior_materializer_v1?mode=training' \
            -o /tmp/structural-prior-training.json
          jq -e '.ok == true and .rowCount == 1530' /tmp/structural-prior-training.json >/dev/null

      - name: Freeze verified production artifacts
        run: |
          rm -rf ml/artifacts/structural_prior_runtime_v1
          python -m ml.demand_engine.freeze_structural_prior_artifacts \
            --input /tmp/structural-prior-training.json \
            --output-dir ml/artifacts/structural_prior_runtime_v1
          cat ml/artifacts/structural_prior_runtime_v1/manifest.json

      - name: Commit changed frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add ml/artifacts/structural_prior_runtime_v1
          if git diff --cached --quiet; then
            echo "Frozen artifacts already match the canonical build."
            exit 0
          fi
          git config user.name "beyond-model-freezer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Structural Prior Runtime v1 artifacts"
          git push origin HEAD:main
