name: Rolling72 future paired drift24 runtime
on:
  push:
    paths:
      - 'supabase/sql/rolling72_mvp_paired_drift24_v1.sql'
      - 'tests/postgres/test_rolling72_mvp_paired_drift24_v1.py'
      - 'tests/postgres/test_rolling72_mvp_paired_drift24_scoring_v1.py'
      - 'supabase/ops/rolling72_mvp_paired_drift24_v1_scorecard_export.sql'
      - 'supabase/sql/rolling72_forward_baselines_b_v1.sql'
      - 'supabase/sql/rolling72_lad_shadow_v5.sql'
      - 'ml/rolling72_paired_drift24_scorecard_v1.py'
      - 'ml/test_rolling72_paired_drift24_scorecard_v1.py'
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/rolling72_mvp_persistence_v1.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'tests/postgres/test_rolling72_mvp_research_v1.py'
      - 'tests/postgres/test_rolling72_mvp_persistence_v1.py'
      - 'tests/postgres/test_roboticket_forward_only_admission_v2.py'
      - '.github/workflows/rolling72-paired-drift24-runtime-v1.yml'
  pull_request:
    paths:
      - 'supabase/sql/rolling72_mvp_paired_drift24_v1.sql'
      - 'tests/postgres/test_rolling72_mvp_paired_drift24_v1.py'
      - 'tests/postgres/test_rolling72_mvp_paired_drift24_scoring_v1.py'
      - 'supabase/ops/rolling72_mvp_paired_drift24_v1_scorecard_export.sql'
      - 'supabase/sql/rolling72_forward_baselines_b_v1.sql'
      - 'supabase/sql/rolling72_lad_shadow_v5.sql'
      - 'ml/rolling72_paired_drift24_scorecard_v1.py'
      - 'ml/test_rolling72_paired_drift24_scorecard_v1.py'
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/rolling72_mvp_persistence_v1.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'tests/postgres/test_rolling72_mvp_research_v1.py'
      - 'tests/postgres/test_rolling72_mvp_persistence_v1.py'
      - 'tests/postgres/test_roboticket_forward_only_admission_v2.py'
      - '.github/workflows/rolling72-paired-drift24-runtime-v1.yml'
permissions:
  contents: read
jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rolling72_mvp_paired_drift24_test
          POSTGRES_PASSWORD: paired-drift24-disposable-ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rolling72_mvp_paired_drift24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.3.9'
      - name: Verify fixed event-level decision report
        run: python -m unittest ml.test_rolling72_paired_drift24_scorecard_v1 -v
      - name: Create separate shared-label regression database
        env:
          TEST_DSN: postgresql://postgres:paired-drift24-disposable-ci@127.0.0.1:55440/rolling72_mvp_paired_drift24_test
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DSN'], autocommit=True) as db:
              db.execute('create database rolling72_mvp_paired_drift24_scoring_test')
          PY
      - name: Verify actual paired coordinates, fallback, shared labels and ACLs
        env:
          ROLLING72_MVP_PAIRED_DRIFT24_TEST_DSN: postgresql://postgres:paired-drift24-disposable-ci@127.0.0.1:55440/rolling72_mvp_paired_drift24_test
          ROLLING72_MVP_PAIRED_DRIFT24_SCORING_TEST_DSN: postgresql://postgres:paired-drift24-disposable-ci@127.0.0.1:55440/rolling72_mvp_paired_drift24_scoring_test
        run: python -m unittest discover -s tests/postgres -p 'test_rolling72_mvp_paired_drift24*_v1.py' -v
