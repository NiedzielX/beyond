name: MAE-Native Global Tournament v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/mae_native_global_tournament_v1.py"
      - "ml/temporal_validation_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - ".github/workflows/mae-native-global-tournament-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/mae_native_global_tournament_v1.py"
      - ".github/workflows/mae-native-global-tournament-v1.yml"

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile
        run: |
          python -m py_compile ml/mae_native_global_tournament_v1.py
          python -m py_compile ml/temporal_validation_v1.py

      - name: Verify canonical history hash
        run: |
          echo "3c6b35142c6bd20a484f2aa758cd41284fd6f4c6db1353b138f81cf321161569  ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz" | sha256sum -c -

      - name: Run strict expanding-season MAE tournament
        run: |
          mkdir -p /tmp/mae-native-global-v1
          python -m ml.mae_native_global_tournament_v1 \
            --history ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output-json /tmp/mae-native-global-v1/result.json \
            --output-predictions-csv /tmp/mae-native-global-v1/predictions.csv
          jq -e '
            .status == "COMPLETED_HISTORICAL_FORWARD_RESEARCH"
            and .evidence_class == "historical_forward_fold"
            and .production_change == false
            and .promotion_allowed == false
            and .match_count == 1530
            and .feature_row_count == 7650
            and (.horizons | length) == 5
          ' /tmp/mae-native-global-v1/result.json >/dev/null

      - name: Show compact scorecard
        run: |
          jq '[.horizons[] | {
            horizon,
            incumbent_mean_fold_mae,
            research_lead_candidate_id,
            decision,
            candidates: [.candidates[] | {
              candidate_id,
              mean_fold_mae,
              mae_delta_vs_incumbent,
              fold_wins_vs_incumbent,
              club_improvement_rate,
              worst_fold_degradation,
              selector_eligible
            }]
          }]' /tmp/mae-native-global-v1/result.json

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: mae-native-global-tournament-v1-${{ github.run_id }}
          path: |
            /tmp/mae-native-global-v1/result.json
            /tmp/mae-native-global-v1/predictions.csv
          if-no-files-found: error
          retention-days: 90
