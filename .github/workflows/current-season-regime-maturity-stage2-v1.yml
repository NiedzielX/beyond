name: Current Season Regime Maturity Stage2 v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/current_season_regime_maturity_stage2_v1.py"
      - "ml/run_current_season_regime_maturity_stage2_v1.py"
      - "ml/test_current_season_regime_maturity_stage2_v1.py"
      - "ml/CURRENT_SEASON_REGIME_MATURITY_STAGE2_V1.md"
      - "ml/current_season_residual_regime_v1.py"
      - "ml/t7_robust_estimator_v1.py"
      - "ml/pre_live_baseline_optimization_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - "ml/artifacts/structural_prior_runtime_v1/manifest.json"
      - ".github/workflows/current-season-regime-maturity-stage2-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/current_season_regime_maturity_stage2_v1.py"
      - "ml/run_current_season_regime_maturity_stage2_v1.py"
      - "ml/test_current_season_regime_maturity_stage2_v1.py"
      - "ml/CURRENT_SEASON_REGIME_MATURITY_STAGE2_V1.md"
      - "ml/current_season_residual_regime_v1.py"
      - "ml/t7_robust_estimator_v1.py"
      - "ml/pre_live_baseline_optimization_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - "ml/artifacts/structural_prior_runtime_v1/manifest.json"
      - ".github/workflows/current-season-regime-maturity-stage2-v1.yml"

permissions:
  contents: read

concurrency:
  group: current-season-regime-maturity-stage2-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile
        run: |
          python -m py_compile ml/current_season_regime_maturity_stage2_v1.py
          python -m py_compile ml/run_current_season_regime_maturity_stage2_v1.py
          python -m py_compile ml/test_current_season_regime_maturity_stage2_v1.py
          python -m py_compile ml/current_season_residual_regime_v1.py
          python -m py_compile ml/t7_robust_estimator_v1.py

      - name: Unit checks
        run: python -m ml.test_current_season_regime_maturity_stage2_v1

      - name: Run maturity stage 2
        run: |
          python -m ml.run_current_season_regime_maturity_stage2_v1 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --manifest ml/artifacts/structural_prior_runtime_v1/manifest.json \
            --output /tmp/current-season-regime-maturity-stage2-v1.json

      - name: Print scorecard
        run: |
          jq '{experiment,promotion_allowed,horizons:[.horizons[]|{horizon,selected_candidate_id,selected_min_prior_home_matches,signal,mean_reference_base_mae,mean_reference_selected_mae,mean_reference_mae_improvement,both_reference_seasons_improve}]}' \
            /tmp/current-season-regime-maturity-stage2-v1.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-season-regime-maturity-stage2-v1-${{ github.run_id }}
          path: /tmp/current-season-regime-maturity-stage2-v1.json
          if-no-files-found: error
          retention-days: 30
