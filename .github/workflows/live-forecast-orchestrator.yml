name: Live Forecast Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-forecast-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-live-forecast-orchestrator")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "BEYOND_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run Live Forecast Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/live_forecast_orchestrator_v1' \
            | tee /tmp/live-forecast-orchestrator.json
          jq . /tmp/live-forecast-orchestrator.json
          jq -e '.ok == true' /tmp/live-forecast-orchestrator.json >/dev/null
