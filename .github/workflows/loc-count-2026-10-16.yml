name: LOC Count 2026-10-16

on:
  push:
    branches:
      - chore/loc-count-2026-10-16

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Count repository LOC and today's changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import json

          CODE_EXT = {'.py','.sql','.ts','.tsx','.js','.jsx','.mjs','.cjs','.sh'}
          AUTO_EXT = {'.yml','.yaml'}
          EXCLUDE_PREFIX = ('ml/artifacts/',)

          def tracked_files():
              out = subprocess.check_output(['git','ls-files'], text=True)
              return [Path(p) for p in out.splitlines() if p]

          def include(path, exts):
              s = path.as_posix()
              return path.suffix.lower() in exts and not s.startswith(EXCLUDE_PREFIX)

          def count_lines(path):
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  return (0,0)
              lines = text.splitlines()
              return len(lines), sum(1 for line in lines if line.strip())

          total = {'code_physical':0,'code_nonblank':0,'automation_physical':0,'automation_nonblank':0,'code_files':0,'automation_files':0}
          by_ext = {}
          for path in tracked_files():
              if include(path, CODE_EXT):
                  physical, nonblank = count_lines(path)
                  total['code_physical'] += physical
                  total['code_nonblank'] += nonblank
                  total['code_files'] += 1
                  item = by_ext.setdefault(path.suffix.lower(), {'files':0,'physical':0,'nonblank':0})
                  item['files'] += 1; item['physical'] += physical; item['nonblank'] += nonblank
              elif include(path, AUTO_EXT):
                  physical, nonblank = count_lines(path)
                  total['automation_physical'] += physical
                  total['automation_nonblank'] += nonblank
                  total['automation_files'] += 1
                  item = by_ext.setdefault(path.suffix.lower(), {'files':0,'physical':0,'nonblank':0})
                  item['files'] += 1; item['physical'] += physical; item['nonblank'] += nonblank

          # Midnight 2026-10-16 Europe/Warsaw = 2026-10-15 22:00:00 UTC (CEST).
          since = '2026-10-15T22:00:00Z'
          log = subprocess.check_output([
              'git','log','--since='+since,'--pretty=format:COMMIT %H','--numstat','--no-renames','main'
          ], text=True)
          today = {'code_add':0,'code_del':0,'automation_add':0,'automation_del':0,'other_add':0,'other_del':0,'commits':0}
          seen_commits = set()
          for line in log.splitlines():
              if line.startswith('COMMIT '):
                  sha = line.split()[1]
                  seen_commits.add(sha)
                  continue
              parts = line.split('\t')
              if len(parts) != 3 or not parts[0].isdigit() or not parts[1].isdigit():
                  continue
              add, dele, name = int(parts[0]), int(parts[1]), parts[2]
              path = Path(name)
              if include(path, CODE_EXT):
                  today['code_add'] += add; today['code_del'] += dele
              elif include(path, AUTO_EXT):
                  today['automation_add'] += add; today['automation_del'] += dele
              else:
                  today['other_add'] += add; today['other_del'] += dele
          today['commits'] = len(seen_commits)
          today['code_net'] = today['code_add'] - today['code_del']
          today['automation_net'] = today['automation_add'] - today['automation_del']
          today['source_plus_automation_add'] = today['code_add'] + today['automation_add']
          today['source_plus_automation_del'] = today['code_del'] + today['automation_del']
          today['source_plus_automation_net'] = today['source_plus_automation_add'] - today['source_plus_automation_del']

          result = {
              'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'scope': {
                  'code_extensions': sorted(CODE_EXT),
                  'automation_extensions': sorted(AUTO_EXT),
                  'excluded_prefixes': list(EXCLUDE_PREFIX),
                  'today_since_utc': since,
                  'today_timezone': 'Europe/Warsaw'
              },
              'repo': total,
              'repo_source_plus_automation_physical': total['code_physical'] + total['automation_physical'],
              'repo_source_plus_automation_nonblank': total['code_nonblank'] + total['automation_nonblank'],
              'today': today,
              'by_extension': dict(sorted(by_ext.items()))
          }
          print('LOC_RESULT='+json.dumps(result, sort_keys=True))
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
