name: Rolling72 next cohort preparation
on:
  pull_request:
    paths:
      - 'ml/*rolling72_damped_trend_v1.py'
      - 'ml/*rolling72_damped_triplet_v1.py'
      - 'ml/*rolling72_stable_pair_paired_evaluation_v1.py'
      - 'ml/rolling72_fresh_paired_drift24_v1.py'
      - 'ml/*rolling72_club_pilot_validate_v1.py'
      - '.github/workflows/rolling72-next-cohort-prep-v1.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m unittest
          ml.test_rolling72_damped_trend_v1
          ml.test_rolling72_damped_triplet_v1
          ml.test_rolling72_club_pilot_validate_v1
          ml.test_rolling72_stable_pair_paired_evaluation_v1 -v
