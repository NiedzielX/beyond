name: Temporal Validation Contract v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/temporal_validation_v1.py"
      - "ml/temporal_validation_manifest_v1.py"
      - "ml/test_temporal_validation_v1.py"
      - ".github/workflows/temporal-validation-contract-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/temporal_validation_v1.py"
      - "ml/temporal_validation_manifest_v1.py"
      - "ml/test_temporal_validation_v1.py"
      - ".github/workflows/temporal-validation-contract-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3
      - name: Compile
        run: |
          python -m py_compile ml/temporal_validation_v1.py
          python -m py_compile ml/temporal_validation_manifest_v1.py
          python -m py_compile ml/test_temporal_validation_v1.py
      - name: Temporal validation regression checks
        run: python -m ml.test_temporal_validation_v1
