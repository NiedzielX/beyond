name: C1 Alpha T1 Hybrid Gate v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/c1_alpha_t1_hybrid_gate_v5.py"
      - "supabase/sql/c1_alpha_training_export_v2.sql"
      - "supabase/functions/c1_alpha_training_export_v1/**"
      - ".github/workflows/c1-alpha-t1-hybrid-gate-v5.yml"
  pull_request:
    paths:
      - "ml/c1_alpha_t1_hybrid_gate_v5.py"
      - "supabase/sql/c1_alpha_training_export_v2.sql"
      - "supabase/functions/c1_alpha_training_export_v1/**"
      - ".github/workflows/c1-alpha-t1-hybrid-gate-v5.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate code
        run: |
          python -m py_compile ml/c1_alpha_t1_hybrid_gate_v5.py
          deno check supabase/functions/c1_alpha_training_export_v1/index.ts

  tournament:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - name: Request C1 training OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-c1-alpha-training")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "C1_ALPHA_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Fetch versioned C1 v2 training payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $C1_ALPHA_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/c1_alpha_training_export_v1?version=v2' \
            -o /tmp/c1-alpha-training-v2.json
          jq -e '.ok == true and .version == "c1-alpha-training-export-v2"' /tmp/c1-alpha-training-v2.json >/dev/null
          jq '{version,eventCount,liveRowCount,hybridRows:(.ticketingChallengerRows|length)}' /tmp/c1-alpha-training-v2.json
      - name: Run hybrid-signal nested LOEO tournament
        run: |
          python -m ml.c1_alpha_t1_hybrid_gate_v5 \
            --input /tmp/c1-alpha-training-v2.json \
            --artifact-dir ml/artifacts/structural_prior_runtime_v1 \
            --output /tmp/c1-alpha-t1-hybrid-gate-v5.json
      - name: Print result
        run: |
          jq '{experiment,event_count,row_count,hybrid_event_count,incumbent:{live_window_mae:.incumbent.live_window_mae},best,goal,top_10:[.leaderboard[:10][]|{candidate,mode,live_window_mae,absolute_uplift,relative_improvement,event_improvement_rate,worst_event_degradation}]}' \
            /tmp/c1-alpha-t1-hybrid-gate-v5.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: c1-alpha-t1-hybrid-gate-v5-${{ github.run_id }}
          path: /tmp/c1-alpha-t1-hybrid-gate-v5.json
          if-no-files-found: error
          retention-days: 30
