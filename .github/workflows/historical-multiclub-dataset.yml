name: Historical Multi-Club Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - 'ml/data/build_historical_multiclub.py'
      - '.github/workflows/historical-multiclub-dataset.yml'
  pull_request:
    paths:
      - 'ml/data/build_historical_multiclub.py'
      - '.github/workflows/historical-multiclub-dataset.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 requests==2.32.5 lxml==6.0.2

      - name: Build dataset and run quality gate
        run: |
          mkdir -p ml/results
          python -m ml.data.build_historical_multiclub \
            --output ml/results/historical_multiclub_fbref_v1.csv \
            --report ml/results/historical_multiclub_fbref_v1_quality.json

      - name: Publish quality summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('ml/results/historical_multiclub_fbref_v1_quality.json').read_text())
          print('# Historical Multi-Club Dataset')
          print()
          print(f"Status: **{r['status']}**")
          print(f"Rows: **{r['rows']}**")
          print(f"Completed: **{r['completed_rows']}**")
          print(f"Attendance observed: **{r['attendance_rows']}**")
          print(f"Clubs: **{r['clubs']}**")
          print()
          print('| Season | Completed | Attendance | Coverage | Home clubs |')
          print('|---|---:|---:|---:|---:|')
          for season, s in r['seasons'].items():
              print(f"| {season} | {s['completed_rows']} | {s['attendance_rows']} | {s['attendance_coverage_pct']:.2f}% | {s['home_clubs']} |")
          PY

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: historical-multiclub-fbref-v1
          path: |
            ml/results/historical_multiclub_fbref_v1.csv
            ml/results/historical_multiclub_fbref_v1_quality.json
          if-no-files-found: error
