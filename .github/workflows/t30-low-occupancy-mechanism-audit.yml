name: T30 Low Occupancy Mechanism Audit

on:
  pull_request:
    paths:
      - "ml/t30_low_occupancy_mechanism_audit.py"
      - ".github/workflows/t30-low-occupancy-mechanism-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile audit
        run: python -m py_compile ml/t30_low_occupancy_mechanism_audit.py

      - name: Run low-occupancy mechanism audit
        run: |
          python -m ml.t30_low_occupancy_mechanism_audit \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/t30-low-occ-mechanism-audit.json

      - name: Print audit summary
        run: |
          jq '{experiment,scope,governance,group_definition,stable_domain_focus,stable_feature_differences}' \
            /tmp/t30-low-occ-mechanism-audit.json
