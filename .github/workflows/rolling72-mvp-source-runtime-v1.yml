name: Rolling72 source runtime contracts
on:
  push:
    paths:
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'tests/postgres/test_rolling72_mvp_research_v1.py'
      - 'tests/postgres/test_roboticket_forward_only_admission_v2.py'
      - '.github/workflows/rolling72-mvp-source-runtime-v1.yml'
  pull_request:
    paths:
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'tests/postgres/test_rolling72_mvp_research_v1.py'
      - 'tests/postgres/test_roboticket_forward_only_admission_v2.py'
      - '.github/workflows/rolling72-mvp-source-runtime-v1.yml'
permissions:
  contents: read
jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rolling72_mvp_research_test
          POSTGRES_PASSWORD: rolling72-disposable-ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rolling72_mvp_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.3.9'
      - name: Verify committed reads, clocks, immutable evidence and permissions
        env:
          ROLLING72_MVP_RESEARCH_TEST_DSN: postgresql://postgres:rolling72-disposable-ci@127.0.0.1:55440/rolling72_mvp_research_test
        run: python -m unittest discover -s tests/postgres -p 'test_rolling72_mvp_research_v1.py' -v
