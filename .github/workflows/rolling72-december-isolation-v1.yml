name: Rolling72 December lane isolation
on:
  pull_request:
    paths:
      - 'ml/rolling72_december_bundle_v1.py'
      - 'tests/postgres/test_rolling72_december_isolation_v1.py'
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/rolling72_mvp_paired_drift24_v1.sql'
      - 'supabase/ops/rolling72_mvp_*_cron.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'ml/artifacts/rolling72_mvp_*/activation_manifest.json'
      - '.github/workflows/rolling72-december-isolation-v1.yml'
permissions:
  contents: read
jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rolling72_december_isolation_test
          POSTGRES_PASSWORD: december-isolation-disposable-ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rolling72_december_isolation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.3.9'
      - run: python -m unittest discover -s tests/postgres -p test_rolling72_december_isolation_v1.py -v
        env:
          ROLLING72_DECEMBER_ISOLATION_TEST_DSN: postgresql://postgres:december-isolation-disposable-ci@127.0.0.1:55440/rolling72_december_isolation_test
