name: C1 Alpha T24 Residual v6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/c1_alpha_t24_residual_v6.py"
      - "supabase/sql/c1_alpha_event_training_export_v1.sql"
      - "supabase/functions/c1_alpha_training_export_v1/**"
      - ".github/workflows/c1-alpha-t24-residual-v6.yml"
  pull_request:
    paths:
      - "ml/c1_alpha_t24_residual_v6.py"
      - "supabase/sql/c1_alpha_event_training_export_v1.sql"
      - "supabase/functions/c1_alpha_training_export_v1/**"
      - ".github/workflows/c1-alpha-t24-residual-v6.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate code
        run: |
          python -m py_compile ml/c1_alpha_t24_residual_v6.py
          deno check supabase/functions/c1_alpha_training_export_v1/index.ts

  tournament:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - name: Request C1 training OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-c1-alpha-training")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "C1_ALPHA_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Fetch lightweight C1 event export
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $C1_ALPHA_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/c1_alpha_training_export_v1?version=event-v1' \
            -o /tmp/c1-alpha-event-v1.json
          jq -e '.ok == true and .version == "c1-alpha-event-training-export-v1"' /tmp/c1-alpha-event-v1.json >/dev/null
          jq '{eventExportVersion:.version} + . + {version:"c1-alpha-training-export-v2"}' \
            /tmp/c1-alpha-event-v1.json > /tmp/c1-alpha-training-v2.json
          jq -e '.version == "c1-alpha-training-export-v2" and .eventExportVersion == "c1-alpha-event-training-export-v1"' \
            /tmp/c1-alpha-training-v2.json >/dev/null
          jq '{eventExportVersion,version,eventCount,hybridRows:(.ticketingChallengerRows|length)}' /tmp/c1-alpha-training-v2.json
      - name: Run event-level T24 residual tournament
        run: |
          python -m ml.c1_alpha_t24_residual_v6 \
            --input /tmp/c1-alpha-training-v2.json \
            --artifact-dir ml/artifacts/structural_prior_runtime_v1 \
            --output /tmp/c1-alpha-t24-residual-v6.json
      - name: Print result
        run: |
          jq '{experiment,event_count,club_count,hybrid_event_count,best,best_loco,goal,oracle_diagnostic_not_for_selection,top_10_loeo:[.leaderboards.leave_one_event_out[:10][]|{candidate,target_mode,mae,absolute_uplift,relative_improvement,event_improvement_rate,worst_event_degradation}]}' \
            /tmp/c1-alpha-t24-residual-v6.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: c1-alpha-t24-residual-v6-${{ github.run_id }}
          path: /tmp/c1-alpha-t24-residual-v6.json
          if-no-files-found: error
          retention-days: 30
