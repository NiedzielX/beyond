name: Trajectory Frozen Encoder Shadow v1

on:
  workflow_dispatch:
  schedule:
    # Immutable shadow windows stay open for only +90 minutes. Two checks per
    # hour reduce the chance that a delayed/dropped GitHub cron consumes a
    # prospective P-7/P-3/P-1 checkpoint. Inference remains frozen/idempotent.
    - cron: "20,50 * * * *"
  push:
    branches:
      - main
    paths:
      - "ml/artifacts/trajectory_frozen_encoder_attendance_head_v1.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: trajectory-frozen-encoder-shadow-v1
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned inference runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scikit-learn==1.8.0
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile shadow runner
        run: |
          test -f ml/artifacts/trajectory_self_supervised_encoder_v1.json
          test -f ml/artifacts/trajectory_frozen_encoder_attendance_head_v1.json
          python -m py_compile ml/demand_engine/trajectory_frozen_encoder_attendance_head_v1.py
          python -m py_compile ml/run_trajectory_frozen_encoder_shadow_v1.py

      - name: Request prospective shadow OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-trajectory-shadow")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "TRAJECTORY_SHADOW_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run immutable prospective shadow check
        run: |
          python -m ml.run_trajectory_frozen_encoder_shadow_v1 \
            --encoder ml/artifacts/trajectory_self_supervised_encoder_v1.json \
            --head ml/artifacts/trajectory_frozen_encoder_attendance_head_v1.json \
            --summary-output /tmp/trajectory-frozen-encoder-shadow-v1-summary.json

      - name: Print shadow summary
        run: |
          jq '{version,due_target_count,attempt_count,prediction_count,score_result,production_change}' \
            /tmp/trajectory-frozen-encoder-shadow-v1-summary.json

      - name: Upload shadow run summary
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-frozen-encoder-shadow-v1-${{ github.run_id }}
          path: /tmp/trajectory-frozen-encoder-shadow-v1-summary.json
          if-no-files-found: error
          retention-days: 30
