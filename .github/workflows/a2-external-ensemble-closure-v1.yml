name: a2 External + Ensemble Closure v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/a2_external_ensemble_closure_v1.py"
      - "ml/test_a2_external_ensemble_closure_v1.py"
      - "ml/A2_EXTERNAL_ENSEMBLE_CLOSURE_V1.md"
      - "ml/pre_live_baseline_optimization_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/demand_engine/freeze_structural_prior_artifacts.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - "ml/artifacts/structural_prior_runtime_v1/manifest.json"
      - ".github/workflows/a2-external-ensemble-closure-v1.yml"
  pull_request:
    paths:
      - "ml/a2_external_ensemble_closure_v1.py"
      - "ml/test_a2_external_ensemble_closure_v1.py"
      - "ml/A2_EXTERNAL_ENSEMBLE_CLOSURE_V1.md"
      - "ml/pre_live_baseline_optimization_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/demand_engine/freeze_structural_prior_artifacts.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - "ml/artifacts/structural_prior_runtime_v1/manifest.json"
      - ".github/workflows/a2-external-ensemble-closure-v1.yml"

permissions:
  contents: read

concurrency:
  group: a2-external-ensemble-closure-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.3.5 \
            pandas==2.2.3 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            catboost==1.2.10 \
            lightgbm==4.7.0 \
            xgboost==3.4.1

      - name: Print dependency versions
        run: |
          python - <<'PY'
          import catboost, joblib, lightgbm, numpy, pandas, sklearn, xgboost
          print({
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "scikit_learn": sklearn.__version__,
              "joblib": joblib.__version__,
              "catboost": catboost.__version__,
              "lightgbm": lightgbm.__version__,
              "xgboost": xgboost.__version__,
          })
          PY

      - name: Compile experiment code
        run: |
          python -m py_compile ml/a2_external_ensemble_closure_v1.py
          python -m py_compile ml/test_a2_external_ensemble_closure_v1.py
          python -m py_compile ml/pre_live_baseline_optimization_v1.py
          python -m py_compile ml/demand_engine/structural_prior_runtime.py
          python -m py_compile ml/demand_engine/freeze_structural_prior_artifacts.py
          python -m py_compile ml/features/structural_prior_feature_store_v1.py

      - name: Run unit checks
        run: python -m ml.test_a2_external_ensemble_closure_v1

      - name: Run all-horizon closure audit
        run: |
          python -m ml.a2_external_ensemble_closure_v1 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --manifest ml/artifacts/structural_prior_runtime_v1/manifest.json \
            --output /tmp/a2-external-ensemble-closure-v1.json

      - name: Print concise result
        run: |
          jq '{
            experiment,
            summary,
            decisions,
            development: (
              .development
              | with_entries(
                  .value = {
                    current_a2_mae: .value.current_a2_mae,
                    selected_contract: .value.selected_contract,
                    top5: .value.final_ranking[0:5]
                  }
                )
            ),
            holdouts: (
              .holdouts
              | with_entries(
                  .value = [
                    .value[]
                    | {
                        season,
                        current_a2_mae,
                        selected_mae: .scorecard_vs_current_a2.candidate.mae,
                        improvement: .scorecard_vs_current_a2.mae_improvement,
                        worst_event_degradation: .scorecard_vs_current_a2.worst_event_degradation
                      }
                  ]
                )
            )
          }' /tmp/a2-external-ensemble-closure-v1.json

      - name: Hash evidence
        run: sha256sum /tmp/a2-external-ensemble-closure-v1.json

      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: a2-external-ensemble-closure-v1-${{ github.run_id }}
          path: /tmp/a2-external-ensemble-closure-v1.json
          if-no-files-found: error
          retention-days: 90
