name: Match Context Future Fixture v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/match_context_future_fixture_v1.py"
      - "ml/MATCH_CONTEXT_AUDIT_V1.md"
      - ".github/workflows/match-context-future-fixture-v1.yml"
  pull_request:
    paths:
      - "ml/match_context_future_fixture_v1.py"
      - "ml/MATCH_CONTEXT_AUDIT_V1.md"
      - ".github/workflows/match-context-future-fixture-v1.yml"

permissions:
  contents: read

concurrency:
  group: match-context-future-fixture-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Validate code
        run: python -m py_compile ml/match_context_future_fixture_v1.py

      - name: Run future-fixture match-context challenger
        run: |
          python -m ml.match_context_future_fixture_v1 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/match-context-future-fixture-v1.json

      - name: Print concise result
        run: |
          jq '{experiment,evidence_class,summary,horizons:[.horizons[]|{horizon,signal,selected_variant:.development.selected_variant.variant,mean_holdout_incumbent_mae,mean_holdout_challenger_mae,mean_holdout_mae_delta}]}' \
            /tmp/match-context-future-fixture-v1.json

      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: match-context-future-fixture-v1-${{ github.run_id }}
          path: /tmp/match-context-future-fixture-v1.json
          if-no-files-found: error
          retention-days: 30
