name: Daily Path PostgreSQL Contract

on:
  push:
    paths:
      - 'supabase/sql/daily_inventory_path_shadow_v1.sql'
      - 'tests/postgres/test_daily_inventory_path_contract_v1.py'
      - 'ml/artifacts/daily_inventory_path_v1.json'
      - '.github/workflows/daily-path-postgres-contract-v1.yml'
  pull_request:
    paths:
      - 'supabase/sql/daily_inventory_path_shadow_v1.sql'
      - 'tests/postgres/test_daily_inventory_path_contract_v1.py'
      - 'ml/artifacts/daily_inventory_path_v1.json'
      - '.github/workflows/daily-path-postgres-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_path_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daily_path_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated DB test driver
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Apply actual migration and test synthetic contracts
        env:
          DAILY_PATH_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/daily_path_contract
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run([
              sys.executable, '-m', 'unittest', 'discover', '-s', 'tests/postgres',
              '-p', 'test_daily_inventory_path_contract_v1.py', '-v',
          ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, flush=True)
          if result.returncode:
              # Only synthetic fixture diagnostics; also visible through the Checks API.
              detail = result.stdout[-16000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Isolated PostgreSQL contract failed::' + detail, flush=True)
          raise SystemExit(result.returncode)
          PY
