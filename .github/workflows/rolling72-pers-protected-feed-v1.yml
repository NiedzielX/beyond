name: Rolling72 protected PERS feed contracts
on:
  push:
    paths:
      - 'supabase/sql/rolling72_mvp_persistence_feed_v1.sql'
      - 'supabase/sql/rolling72_pilot_access_v2.sql'
      - 'supabase/sql/rolling72_mvp_persistence_issue_clock_guard_v1.sql'
      - 'tests/postgres/test_rolling72_mvp_persistence_issue_clock_guard_v1.py'
      - 'supabase/sql/rolling72_mvp_persistence_v1.sql'
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'supabase/functions/rolling72_pilot_feed_v2/**'
      - 'tests/postgres/test_rolling72_mvp_persistence_feed_v1.py'
      - 'tests/postgres/test_rolling72_pilot_access_v2.py'
      - 'tests/postgres/test_rolling72_mvp_persistence_v1.py'
      - 'tests/postgres/test_rolling72_mvp_research_v1.py'
      - 'tests/postgres/test_roboticket_forward_only_admission_v2.py'
      - '.github/workflows/rolling72-pers-protected-feed-v1.yml'
  pull_request:
    paths:
      - 'supabase/sql/rolling72_mvp_persistence_feed_v1.sql'
      - 'supabase/sql/rolling72_pilot_access_v2.sql'
      - 'supabase/sql/rolling72_mvp_persistence_issue_clock_guard_v1.sql'
      - 'tests/postgres/test_rolling72_mvp_persistence_issue_clock_guard_v1.py'
      - 'supabase/sql/rolling72_mvp_persistence_v1.sql'
      - 'supabase/sql/rolling72_mvp_research_v1.sql'
      - 'supabase/sql/roboticket_forward_only_admission_v2.sql'
      - 'supabase/functions/rolling72_pilot_feed_v2/**'
      - 'tests/postgres/test_rolling72_mvp_persistence_feed_v1.py'
      - 'tests/postgres/test_rolling72_pilot_access_v2.py'
      - 'tests/postgres/test_rolling72_mvp_persistence_v1.py'
      - 'tests/postgres/test_rolling72_mvp_research_v1.py'
      - 'tests/postgres/test_roboticket_forward_only_admission_v2.py'
      - '.github/workflows/rolling72-pers-protected-feed-v1.yml'
permissions:
  contents: read
jobs:
  postgres16-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rolling72_mvp_persistence_feed_test
          POSTGRES_PASSWORD: rolling72-disposable-ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rolling72_mvp_persistence_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROLLING72_MVP_PERSISTENCE_FEED_TEST_DSN: postgresql://postgres:rolling72-disposable-ci@127.0.0.1:55440/rolling72_mvp_persistence_feed_test
      ROLLING72_PILOT_ACCESS_V2_TEST_DSN: postgresql://postgres:rolling72-disposable-ci@127.0.0.1:55440/rolling72_pilot_access_v2_test
      ROLLING72_MVP_ISSUE_CLOCK_GUARD_TEST_DSN: postgresql://postgres:rolling72-disposable-ci@127.0.0.1:55440/rolling72_mvp_issue_clock_guard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.3.9'
      - name: Create separate capability-test database
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['ROLLING72_MVP_PERSISTENCE_FEED_TEST_DSN'], autocommit=True) as db:
              db.execute('create database rolling72_pilot_access_v2_test')
              db.execute('create database rolling72_mvp_issue_clock_guard_test')
          PY
      - name: Verify strict actual issue clocks and persistence regressions
        run: python -m unittest discover -s tests/postgres -p 'test_rolling72_mvp_persistence_issue_clock_guard_v1.py' -v
      - name: Verify source, vintage, label and coverage projection
        run: python -m unittest discover -s tests/postgres -p 'test_rolling72_mvp_persistence_feed_v1.py' -v
      - name: Verify narrow capability scope and database permissions
        run: python -m unittest discover -s tests/postgres -p 'test_rolling72_pilot_access_v2.py' -v
      - name: Verify authenticated Edge routing and old-scope regressions
        run: node --experimental-strip-types --test supabase/functions/rolling72_pilot_feed_v2/handler.test.ts
