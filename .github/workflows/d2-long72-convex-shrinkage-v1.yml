name: d2 Long72 Convex Shrinkage v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/d2_long72_convex_shrinkage_v1.py"
      - "ml/test_d2_long72_convex_shrinkage_v1.py"
      - "ml/results/D2_LONG72_CONVEX_SHRINKAGE_V1_2026-10-22.md"
      - ".github/workflows/d2-long72-convex-shrinkage-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/d2_long72_convex_shrinkage_v1.py"
      - "ml/test_d2_long72_convex_shrinkage_v1.py"
      - "ml/results/D2_LONG72_CONVEX_SHRINKAGE_V1_2026-10-22.md"
      - ".github/workflows/d2-long72-convex-shrinkage-v1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: d2-long72-convex-shrinkage-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3
      - name: Compile and unit checks
        run: |
          python -m py_compile ml/d2_long72_convex_shrinkage_v1.py
          python -m py_compile ml/test_d2_long72_convex_shrinkage_v1.py
          python -m ml.test_d2_long72_convex_shrinkage_v1

  evaluate-main:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3

      - name: Download immutable frozen Stage2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NiedzielX/beyond/actions/artifacts/12366826274/zip" \
            -o /tmp/d2-long72-stage2.zip
          echo 'c750cf385b2c6b6f05fabceaf68ff323a66235862967900419be421f7cdcb4ae  /tmp/d2-long72-stage2.zip' | sha256sum -c -
          mkdir -p /tmp/d2-long72-stage2
          unzip -q /tmp/d2-long72-stage2.zip -d /tmp/d2-long72-stage2
          echo '489ba62156f19d3b915fda1b9f1ef506fb81603d4286a01e8ad4b799c58bce4b  /tmp/d2-long72-stage2/d2-long72-stage2-predictions.csv' | sha256sum -c -

      - name: Run convex shrinkage tournament
        run: |
          python -m ml.d2_long72_convex_shrinkage_v1 \
            --predictions-csv /tmp/d2-long72-stage2/d2-long72-stage2-predictions.csv \
            --output-json /tmp/d2-long72-convex-shrinkage-v1.json

      - name: Hard evidence gate
        run: |
          jq -e '
            .version == "d2-long72-convex-shrinkage-v1"
            and .status == "COMPLETED_FORWARD_EVENT_CONVEX_SHRINKAGE_TOURNAMENT"
            and .evidence_class == "historical_forward_event_exposed_research"
            and .decision == "RETAIN_FROZEN_P2_NO_SHRINKAGE_REPLACEMENT"
            and .selected_candidate.candidate_id == "fixed-w1.00"
            and .selected_candidate.independent_event_count == 8
            and .selected_candidate.event_balanced_mae > 2472.29
            and .selected_candidate.event_balanced_mae < 2472.31
            and .interpretation.adaptive_delta_mae_vs_p2 > 91.90
            and .interpretation.adaptive_delta_mae_vs_p2 < 91.94
            and .production_change == false
            and .promotion_allowed == false
            and .live_adjustment == 0
          ' /tmp/d2-long72-convex-shrinkage-v1.json >/dev/null

      - name: Print result
        run: |
          jq '{decision,selected_candidate,adaptive_vs_frozen_p2,fold_selection,interpretation}' /tmp/d2-long72-convex-shrinkage-v1.json
          sha256sum /tmp/d2-long72-convex-shrinkage-v1.json

      - name: Upload P5a evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-long72-convex-shrinkage-v1-${{ github.run_id }}
          path: /tmp/d2-long72-convex-shrinkage-v1.json
          if-no-files-found: error
          retention-days: 90
