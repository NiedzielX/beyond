name: Daily Inventory Path Shadow v1

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

# Remains inactive until migration/gateway deployment and an explicit enable.
# No service-role secret is stored in GitHub; the new gateway validates OIDC.
permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-inventory-path-shadow-v1
  cancel-in-progress: false

jobs:
  shadow:
    if: vars.DAILY_INVENTORY_PATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned inference dependency
        run: python -m pip install numpy==2.3.5
      - name: Obtain scoped OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-daily-inventory-path-v1")
          token=$(jq -er '.value' <<< "$response")
          echo "::add-mask::$token"
          echo "DAILY_INVENTORY_PATH_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Capture immutable daily paths and score genuine observations
        run: |
          python -m ml.run_daily_inventory_path_gateway_v1 \
            --runtime /tmp/daily-inventory-path-v1 \
            --artifact ml/artifacts/daily_inventory_path_v1.json \
            --panel-feed /tmp/daily-inventory-path-v1/panel-feed.json
      - name: Retain audit and panel payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-inventory-path-v1-${{ github.run_id }}
          path: |
            /tmp/daily-inventory-path-v1/shadow-v1.sqlite
            /tmp/daily-inventory-path-v1/remote-published-v1.json
            /tmp/daily-inventory-path-v1/gateway-summary.json
            /tmp/daily-inventory-path-v1/panel-feed.json
          if-no-files-found: warn
          retention-days: 14
