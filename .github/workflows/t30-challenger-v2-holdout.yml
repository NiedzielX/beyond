name: T30 Challenger v2 Holdout Verification

on:
  pull_request:
    paths:
      - "ml/t30_challenger_v2_holdout_verify.py"
      - "ml/results/T30_CHALLENGER_V2_FROZEN_SPEC_2026-10-16.md"
      - ".github/workflows/t30-challenger-v2-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Verify frozen spec commit exists in experiment history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin exp/t30-dev-challenger-v2
          git merge-base --is-ancestor \
            2d02f247e151dc191d4af8790b87288fd5aaa68c \
            origin/exp/t30-dev-challenger-v2

      - name: Compile verifier
        run: python -m py_compile ml/t30_challenger_v2_holdout_verify.py

      - name: Run single untouched-holdout verification
        run: |
          python -m ml.t30_challenger_v2_holdout_verify \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/t30-challenger-v2-holdout.json

      - name: Print frozen challenger verification
        run: cat /tmp/t30-challenger-v2-holdout.json
