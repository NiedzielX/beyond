name: MAE Delta Uncertainty v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/mae_delta_uncertainty_v1.py"
      - "ml/test_mae_delta_uncertainty_v1.py"
      - ".github/workflows/mae-delta-uncertainty-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/mae_delta_uncertainty_v1.py"
      - "ml/test_mae_delta_uncertainty_v1.py"
      - ".github/workflows/mae-delta-uncertainty-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3
      - name: Compile
        run: |
          python -m py_compile ml/mae_delta_uncertainty_v1.py
          python -m py_compile ml/test_mae_delta_uncertainty_v1.py
      - name: Regression checks
        run: python -m ml.test_mae_delta_uncertainty_v1
