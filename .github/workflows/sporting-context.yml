name: Sporting Context Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "ml/context/**"
      - ".github/workflows/sporting-context.yml"

jobs:
  verify-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile ml/context/sporting_context_v01.py

      - name: Unit tests
        run: python -m unittest ml.context.test_sporting_context_v01

      - name: Collect point-in-time context
        env:
          SUPABASE_URL: https://adchzwqboeekhokapxqi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; collection skipped after verification."
            exit 0
          fi
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY is not configured; static match context will still be collected."
          fi
          python ml/context/sporting_context_v01.py --days 30
