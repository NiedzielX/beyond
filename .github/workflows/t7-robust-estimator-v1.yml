name: T-7 Robust Estimator v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/t7_robust_estimator_v1.py"
      - "ml/test_t7_robust_estimator_v1.py"
      - "ml/T7_ROBUST_ESTIMATOR_V1.md"
      - "ml/pre_live_baseline_optimization_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/demand_engine/freeze_structural_prior_artifacts.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - "ml/artifacts/structural_prior_runtime_v1/manifest.json"
      - ".github/workflows/t7-robust-estimator-v1.yml"
  pull_request:
    paths:
      - "ml/t7_robust_estimator_v1.py"
      - "ml/test_t7_robust_estimator_v1.py"
      - "ml/T7_ROBUST_ESTIMATOR_V1.md"
      - "ml/pre_live_baseline_optimization_v1.py"
      - "ml/demand_engine/structural_prior_runtime.py"
      - "ml/demand_engine/freeze_structural_prior_artifacts.py"
      - "ml/features/structural_prior_feature_store_v1.py"
      - "ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz"
      - "ml/artifacts/structural_prior_runtime_v1/manifest.json"
      - ".github/workflows/t7-robust-estimator-v1.yml"

permissions:
  contents: read

concurrency:
  group: t7-robust-estimator-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile experiment code
        run: |
          python -m py_compile ml/t7_robust_estimator_v1.py
          python -m py_compile ml/test_t7_robust_estimator_v1.py
          python -m py_compile ml/pre_live_baseline_optimization_v1.py
          python -m py_compile ml/demand_engine/structural_prior_runtime.py
          python -m py_compile ml/demand_engine/freeze_structural_prior_artifacts.py
          python -m py_compile ml/features/structural_prior_feature_store_v1.py

      - name: Run unit checks
        run: python -m ml.test_t7_robust_estimator_v1

      - name: Run T-7 robust estimator experiment
        run: |
          python -m ml.t7_robust_estimator_v1 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --manifest ml/artifacts/structural_prior_runtime_v1/manifest.json \
            --output /tmp/t7-robust-estimator-v1.json

      - name: Print concise result
        run: |
          jq '{experiment,selected_candidate,summary,development_ranking:.development.ranking,holdouts:[.holdouts[]|{season,mae_improvement:.scorecard.mae_improvement,median_ae:.scorecard.candidate.median_ae,p90_ae:.scorecard.candidate.p90_ae,bias:.scorecard.candidate.bias,worst_event_degradation:.scorecard.worst_event_degradation,worst_event:.scorecard.worst_event,tail_vs_stage1_hist31}]}' \
            /tmp/t7-robust-estimator-v1.json

      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: t7-robust-estimator-v1-${{ github.run_id }}
          path: /tmp/t7-robust-estimator-v1.json
          if-no-files-found: error
          retention-days: 30
