name: T30 Prevalidation Error Audit v1

on:
  pull_request:
    paths:
      - "ml/t30_prevalidation_error_audit_v1.py"
      - ".github/workflows/t30-prevalidation-error-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile audit
        run: python -m py_compile ml/t30_prevalidation_error_audit_v1.py

      - name: Run pre-validation error audit
        run: |
          python -m ml.t30_prevalidation_error_audit_v1 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/t30-prevalidation-error-audit-v1.json

      - name: Print audit summary
        run: |
          jq '{experiment,governance,overall,stable_priority_segments,strongest_stable_bias_segments}' \
            /tmp/t30-prevalidation-error-audit-v1.json
