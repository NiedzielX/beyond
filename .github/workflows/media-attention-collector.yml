name: Media Attention Collector

# Forward-only research sampler. Context remains shadow-only until explicit promotion.
# v2 separates broad event-team attention from exact match-pair mentions.
on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
  push:
    paths:
      - "ml/context/gdelt_ngram_sample_v02.py"
      - "ml/context/test_gdelt_ngram_sample_v02.py"
      - ".github/workflows/media-attention-collector.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: media-attention-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify v2 matcher
        run: |
          python -m py_compile ml/context/gdelt_ngram_sample_v02.py
          python -m unittest ml.context.test_gdelt_ngram_sample_v02

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-media-ingest")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "BEYOND_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Fetch live event media config v2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/media_attention_ingest_v02?mode=config' \
            -o /tmp/media-config.json
          jq '{ok,version,eventCount:(.events|length),events:[.events[]|{id,homeTeam,awayTeam}]}' /tmp/media-config.json

      - name: Collect GDELT Web NGrams v2 sample
        run: python ml/context/gdelt_ngram_sample_v02.py --config /tmp/media-config.json --output /tmp/media-payload.json

      - name: Ingest v2 sample into Beyond
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/media-payload.json \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/media_attention_ingest_v02' \
            | tee /tmp/media-ingest-response.json
          jq . /tmp/media-ingest-response.json
