name: Global Historical Benchmark v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ml/features/global_feature_store_v2.py'
      - 'ml/global_historical_benchmark_v1.py'
      - 'ml/data/build_historical_multiclub.py'
      - '.github/workflows/global-historical-benchmark-v1.yml'
  pull_request:
    paths:
      - 'ml/features/global_feature_store_v2.py'
      - 'ml/global_historical_benchmark_v1.py'
      - 'ml/data/build_historical_multiclub.py'
      - '.github/workflows/global-historical-benchmark-v1.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.5

      - name: Build canonical Feature Store v2 artifact
        run: |
          mkdir -p ml/results
          python -m ml.features.global_feature_store_v2 \
            --output ml/results/global_feature_store_v2.csv \
            --report ml/results/global_feature_store_v2_quality.json

      - name: Run global historical benchmark
        run: |
          python -m ml.global_historical_benchmark_v1 \
            --output ml/results/global_historical_benchmark_v1.json \
            --markdown-output ml/results/global_historical_benchmark_v1.md

      - name: Publish benchmark summary
        run: cat ml/results/global_historical_benchmark_v1.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: global-historical-benchmark-v1
          path: |
            ml/results/global_feature_store_v2.csv
            ml/results/global_feature_store_v2_quality.json
            ml/results/global_historical_benchmark_v1.json
            ml/results/global_historical_benchmark_v1.md
          if-no-files-found: error
