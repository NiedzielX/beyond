name: P11 Odds Capture v2

# Genuine forward-only PIT market capture.
# Primary capture runs every six hours. A second schedule 30 minutes later is a
# stale-health fallback: it calls the provider only when no fresh capture exists.
on:
  workflow_dispatch:
    inputs:
      capture:
        description: "Force one genuine provider capture after contract/tests pass"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
    - cron: "47 0,6,12,18 * * *"
  pull_request:
    paths:
      - "supabase/functions/p11_odds_capture_v2/**"
      - "supabase/functions/p11_odds_capture_health_v2/**"
      - "supabase/sql/p11_market_odds_capture_v2.sql"
      - "supabase/sql/p11_market_odds_capture_health_v2.sql"
      - ".github/workflows/p11-odds-capture-v2.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/p11_odds_capture_v2/**"
      - "supabase/functions/p11_odds_capture_health_v2/**"
      - "supabase/sql/p11_market_odds_capture_v2.sql"
      - "supabase/sql/p11_market_odds_capture_health_v2.sql"
      - ".github/workflows/p11-odds-capture-v2.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: p11-odds-capture-v2
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check provider and health adapters
        run: |
          deno check supabase/functions/p11_odds_capture_v2/provider.ts
          deno check supabase/functions/p11_odds_capture_v2/index.ts
          deno check supabase/functions/p11_odds_capture_health_v2/index.ts

      - name: Run provider adapter tests
        run: deno test supabase/functions/p11_odds_capture_v2/provider_test.ts

  capture:
    if: (github.event_name == 'workflow_dispatch' && inputs.capture == true) || github.event_name == 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "P11 genuine capture is allowed from main only" >&2
            exit 1
          }

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --retry 4 --retry-all-errors --retry-delay 2 -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-p11-odds-capture")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "BEYOND_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Decide whether capture is due
        id: health
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "capture_due=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl --retry 4 --retry-all-errors --retry-delay 2 -fsS \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/p11_odds_capture_health_v2' \
            -o /tmp/p11-health.json
          jq . /tmp/p11-health.json
          test "$(jq -r '.ok' /tmp/p11-health.json)" = "true"
          test "$(jq -r '.productionChange' /tmp/p11-health.json)" = "false"
          test "$(jq -r '.health.target_values_used' /tmp/p11-health.json)" = "false"
          due="$(jq -r '.health.capture_due' /tmp/p11-health.json)"
          test "$due" = "true" -o "$due" = "false"
          echo "capture_due=$due" >> "$GITHUB_OUTPUT"
          echo "reason=schedule_health" >> "$GITHUB_OUTPUT"

      - name: Verify capture configuration
        if: steps.health.outputs.capture_due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsS \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/p11_odds_capture_v2?mode=config' \
            -o /tmp/p11-config.json
          jq . /tmp/p11-config.json
          test "$(jq -r '.ok' /tmp/p11-config.json)" = "true"
          if [ "$(jq -r '.configured' /tmp/p11-config.json)" != "true" ]; then
            echo "THE_ODDS_API_KEY is not configured in Supabase Edge Function secrets" >&2
            exit 1
          fi
          test "$(jq -r '.productionChange' /tmp/p11-config.json)" = "false"

      - name: Capture genuine pre-match 1X2 odds
        if: steps.health.outputs.capture_due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --retry 4 --retry-all-errors --retry-delay 2 -sS \
            -X POST \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            -o /tmp/p11-capture.json \
            -w '%{http_code}' \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/p11_odds_capture_v2')
          jq . /tmp/p11-capture.json
          test "$http_code" = "200"
          test "$(jq -r '.ok' /tmp/p11-capture.json)" = "true"
          test "$(jq -r '.targetValuesUsed' /tmp/p11-capture.json)" = "false"
          test "$(jq -r '.productionChange' /tmp/p11-capture.json)" = "false"

      - name: Verify fresh health after capture
        if: steps.health.outputs.capture_due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsS \
            -H "Authorization: Bearer $BEYOND_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/p11_odds_capture_health_v2' \
            -o /tmp/p11-health-after.json
          jq . /tmp/p11-health-after.json
          test "$(jq -r '.ok' /tmp/p11-health-after.json)" = "true"
          test "$(jq -r '.health.capture_due' /tmp/p11-health-after.json)" = "false"
          test "$(jq -r '.health.target_values_used' /tmp/p11-health-after.json)" = "false"
          test "$(jq -r '.productionChange' /tmp/p11-health-after.json)" = "false"

      - name: Publish capture summary
        if: always()
        shell: bash
        env:
          CAPTURE_DUE: ${{ steps.health.outputs.capture_due }}
          CAPTURE_REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo '### P11 Odds Capture v2'
            echo
            echo "- capture due: \`${CAPTURE_DUE:-unknown}\`"
            echo "- decision source: \`${CAPTURE_REASON:-unknown}\`"
            if [ "${CAPTURE_DUE:-false}" = "true" ] && [ -s /tmp/p11-capture.json ]; then
              status=$(jq -r '.status // "n/a"' /tmp/p11-capture.json)
              local_events=$(jq -r '.localEvents // 0' /tmp/p11-capture.json)
              provider_events=$(jq -r '.providerEvents // 0' /tmp/p11-capture.json)
              matched_events=$(jq -r '.matchedEvents // 0' /tmp/p11-capture.json)
              inserted_quotes=$(jq -r '.insertedQuotes // 0' /tmp/p11-capture.json)
              quota_remaining=$(jq -r '.quota.remaining // "n/a"' /tmp/p11-capture.json)
              quota_used=$(jq -r '.quota.used // "n/a"' /tmp/p11-capture.json)
              quota_last=$(jq -r '.quota.last // "n/a"' /tmp/p11-capture.json)
              production_change=$(jq -r '.productionChange // false' /tmp/p11-capture.json)
              echo "- status: \`${status}\`"
              echo "- local events: \`${local_events}\`"
              echo "- provider events: \`${provider_events}\`"
              echo "- matched events: \`${matched_events}\`"
              echo "- inserted raw bookmaker quotes: \`${inserted_quotes}\`"
              echo "- quota remaining: \`${quota_remaining}\`"
              echo "- quota used: \`${quota_used}\`"
              echo "- last request cost: \`${quota_last}\`"
              echo "- production change: \`${production_change}\`"
            elif [ "${CAPTURE_DUE:-false}" = "true" ]; then
              echo '- capture result: `MISSING_CAPTURE_FILE`'
            else
              echo '- provider call: `SKIPPED_RECENT_CAPTURE_HEALTHY`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
