name: T30 Occupancy Anchor v4

on:
  pull_request:
    paths:
      - "ml/t30_occupancy_anchor_v4.py"
      - ".github/workflows/t30-occupancy-anchor-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-origin-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile v4 experiment
        run: python -m py_compile ml/t30_occupancy_anchor_v4.py

      - name: Run rolling-origin pre-validation gate
        run: |
          python -m ml.t30_occupancy_anchor_v4 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/t30-occupancy-anchor-v4.json

      - name: Print decision summary
        run: |
          jq '{experiment,hypothesis,governance,anchor_coverage_by_season,control,best,passing_candidate_count,best_passing_candidate,decision}' \
            /tmp/t30-occupancy-anchor-v4.json
