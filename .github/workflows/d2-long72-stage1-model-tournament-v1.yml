name: d2 Long72 Stage1 Model Tournament v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/d2_long72_stage1_model_tournament_v1.py"
      - "ml/test_d2_long72_stage1_model_tournament_v1.py"
      - "ml/D2_LONG72_STAGE1_MODEL_TOURNAMENT_V1.md"
      - "ml/results/D2_LONG72_ANCHOR_CONTRACT_V1_2026-10-21.md"
      - ".github/workflows/d2-long72-stage1-model-tournament-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/d2_long72_stage1_model_tournament_v1.py"
      - "ml/test_d2_long72_stage1_model_tournament_v1.py"
      - "ml/D2_LONG72_STAGE1_MODEL_TOURNAMENT_V1.md"
      - "ml/results/D2_LONG72_ANCHOR_CONTRACT_V1_2026-10-21.md"
      - ".github/workflows/d2-long72-stage1-model-tournament-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - name: Compile and unit checks
        run: |
          python -m py_compile ml/d2_long72_stage1_model_tournament_v1.py
          python -m py_compile ml/test_d2_long72_stage1_model_tournament_v1.py
          python -m ml.test_d2_long72_stage1_model_tournament_v1
      - name: Frozen input and selector contract checks
        run: |
          grep -q '12365352293' ml/results/D2_LONG72_ANCHOR_CONTRACT_V1_2026-10-21.md
          grep -q '2af6209484e7120f08541d82bc7bcd064b0f9ea46dd59bb5e7d2746cb35a214c' ml/d2_long72_stage1_model_tournament_v1.py
          grep -q 'Require positive 0-72h and 24-72h' ml/d2_long72_stage1_model_tournament_v1.py
          grep -q '48–72h' ml/D2_LONG72_STAGE1_MODEL_TOURNAMENT_V1.md

  evaluate-main:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Stage1 + TSFM runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements-d2-tsfm-v1.txt
      - name: Download pinned frozen long72 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/long72
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/NiedzielX/beyond/actions/artifacts/12365352293/zip \
            -o /tmp/long72.zip
          echo '83082cca46b6aa78fd744f59e9fd7eaaef6e7d33e8135817bda78a201b454561  /tmp/long72.zip' | sha256sum -c -
          unzip -q /tmp/long72.zip -d /tmp/long72
          test -f /tmp/long72/d2-long72-contract.json
          test -f /tmp/long72/d2-long72-dataset.csv
          echo '0083b82be7de4599574b90ed0af44e1accd1a993c1d07b7f263bfbf01f3a1a27  /tmp/long72/d2-long72-contract.json' | sha256sum -c -
          echo '2af6209484e7120f08541d82bc7bcd064b0f9ea46dd59bb5e7d2746cb35a214c  /tmp/long72/d2-long72-dataset.csv' | sha256sum -c -
      - name: Run bounded long72 LOEO tournament
        run: |
          python -m ml.d2_long72_stage1_model_tournament_v1 \
            --input-csv /tmp/long72/d2-long72-dataset.csv \
            --output-json /tmp/d2-long72-stage1.json \
            --output-predictions-csv /tmp/d2-long72-stage1-predictions.csv \
            --with-tsfm
      - name: Hard evidence gates
        run: |
          jq -e '
            .status == "COMPLETED_HISTORICAL_RESEARCH_TOURNAMENT"
            and .promotion_allowed == false
            and .production_change == false
            and .evidence_class == "EXPOSED_HISTORICAL_R_AND_D"
            and .event_count == 14
            and .row_count == 130
            and (.candidates | length) == 8
            and (.research_lead_candidate_id | length) > 0
          ' /tmp/d2-long72-stage1.json >/dev/null
      - name: Print leaderboard and hashes
        run: |
          jq '{experiment,research_lead_candidate_id,tsfm,candidates:[.candidates[]|{candidate_id,overall:.overall_0_72h|{event_balanced_window_mae,window_mae_improvement,latest_row_mae,latest_mae_improvement,worst_latest_event_degradation},early:.bands."24_72h",far:.bands."48_72h"}]}' /tmp/d2-long72-stage1.json
          sha256sum /tmp/d2-long72-stage1.json
          sha256sum /tmp/d2-long72-stage1-predictions.csv
      - name: Upload long72 Stage1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-long72-stage1-model-tournament-v1-${{ github.run_id }}
          path: |
            /tmp/d2-long72-stage1.json
            /tmp/d2-long72-stage1-predictions.csv
          if-no-files-found: error
          retention-days: 90
