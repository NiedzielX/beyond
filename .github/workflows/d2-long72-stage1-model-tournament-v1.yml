name: d2 Long72 Stage1 Model Tournament v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/d2_long72_stage1_model_tournament_v1.py"
      - "ml/test_d2_long72_stage1_model_tournament_v1.py"
      - "ml/results/D2_LONG72_ANCHOR_CONTRACT_V1_2026-10-21.md"
      - ".github/workflows/d2-long72-stage1-model-tournament-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/d2_long72_stage1_model_tournament_v1.py"
      - "ml/test_d2_long72_stage1_model_tournament_v1.py"
      - "ml/results/D2_LONG72_ANCHOR_CONTRACT_V1_2026-10-21.md"
      - ".github/workflows/d2-long72-stage1-model-tournament-v1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: d2-long72-stage1-model-tournament-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - name: Compile and unit checks
        run: |
          python -m py_compile ml/d2_long72_stage1_model_tournament_v1.py
          python -m py_compile ml/test_d2_long72_stage1_model_tournament_v1.py
          python -m ml.test_d2_long72_stage1_model_tournament_v1

  evaluate-main:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Download immutable frozen long72 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NiedzielX/beyond/actions/artifacts/12365352293/zip" \
            -o /tmp/d2-long72-frozen.zip
          echo '83082cca46b6aa78fd744f59e9fd7eaaef6e7d33e8135817bda78a201b454561  /tmp/d2-long72-frozen.zip' | sha256sum -c -
          mkdir -p /tmp/d2-long72-frozen
          unzip -q /tmp/d2-long72-frozen.zip -d /tmp/d2-long72-frozen
          test -f /tmp/d2-long72-frozen/d2-long72-contract.json
          test -f /tmp/d2-long72-frozen/d2-long72-dataset.csv
          echo '0083b82be7de4599574b90ed0af44e1accd1a993c1d07b7f263bfbf01f3a1a27  /tmp/d2-long72-frozen/d2-long72-contract.json' | sha256sum -c -
          echo '2af6209484e7120f08541d82bc7bcd064b0f9ea46dd59bb5e7d2746cb35a214c  /tmp/d2-long72-frozen/d2-long72-dataset.csv' | sha256sum -c -
          jq -e '
            .status == "FROZEN_LONG72_DATA_AND_ANCHOR_CONTRACT"
            and .dataset.event_count == 14
            and .dataset.row_count == 130
            and .model_training_performed == false
          ' /tmp/d2-long72-frozen/d2-long72-contract.json >/dev/null

      - name: Run 24-72h LOEO tournament
        run: |
          python -m ml.d2_long72_stage1_model_tournament_v1 \
            --input-csv /tmp/d2-long72-frozen/d2-long72-dataset.csv \
            --output-json /tmp/d2-long72-stage1.json \
            --output-predictions-csv /tmp/d2-long72-stage1-predictions.csv

      - name: Hard evidence gate
        run: |
          jq -e '
            .status == "COMPLETED_RESEARCH_TOURNAMENT"
            and .production_change == false
            and .promotion_allowed == false
            and .event_count == 13
            and .row_count == 80
            and .candidate_count == 7
            and (.research_lead_candidate_id | length) > 0
          ' /tmp/d2-long72-stage1.json >/dev/null

      - name: Print leaderboard and hashes
        run: |
          jq '{research_lead_candidate_id,event_count,row_count,candidates:[.candidates[]|{candidate_id,selector_eligible,overall:.scorecard.overall_24_72h,band_24_48h:.scorecard.band_24_48h,band_48_72h:.scorecard.band_48_72h}]}' /tmp/d2-long72-stage1.json
          sha256sum /tmp/d2-long72-frozen/d2-long72-contract.json
          sha256sum /tmp/d2-long72-frozen/d2-long72-dataset.csv
          sha256sum /tmp/d2-long72-stage1.json
          sha256sum /tmp/d2-long72-stage1-predictions.csv

      - name: Upload Stage1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-long72-stage1-model-tournament-v1-${{ github.run_id }}
          path: |
            /tmp/d2-long72-frozen/d2-long72-contract.json
            /tmp/d2-long72-frozen/d2-long72-dataset.csv
            /tmp/d2-long72-stage1.json
            /tmp/d2-long72-stage1-predictions.csv
          if-no-files-found: error
          retention-days: 90
