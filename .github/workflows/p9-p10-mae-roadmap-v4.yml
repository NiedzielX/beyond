name: P9 P10 MAE Roadmap v4

on:
  pull_request:
    paths:
      - "ml/MAE_RESEARCH_ROADMAP_V4.md"
      - "ml/research_advance_governance_v2.py"
      - "ml/test_research_advance_governance_v2.py"
      - "ml/p9_booking_curve_v1.py"
      - "ml/test_p9_booking_curve_v1.py"
      - "ml/p10_pooled_horizon_global_v1.py"
      - "ml/test_p10_pooled_horizon_global_v1.py"
      - "ml/results/P9_P10_PRECOMMIT_V1_2026-10-23.md"
      - "ml/PROGRESS_TRACKING.md"
      - "AI_BOOTSTRAP.md"
      - "AGENTS.md"
      - ".github/workflows/p9-p10-mae-roadmap-v4.yml"
  push:
    branches: [main]
    paths:
      - "ml/MAE_RESEARCH_ROADMAP_V4.md"
      - "ml/research_advance_governance_v2.py"
      - "ml/test_research_advance_governance_v2.py"
      - "ml/p9_booking_curve_v1.py"
      - "ml/test_p9_booking_curve_v1.py"
      - "ml/p10_pooled_horizon_global_v1.py"
      - "ml/test_p10_pooled_horizon_global_v1.py"
      - "ml/results/P9_P10_PRECOMMIT_V1_2026-10-23.md"
      - "ml/PROGRESS_TRACKING.md"
      - "AI_BOOTSTRAP.md"
      - "AGENTS.md"
      - ".github/workflows/p9-p10-mae-roadmap-v4.yml"

permissions:
  contents: read

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ML dependencies
        run: pip install -r ml/requirements.txt
      - name: Compile roadmap v4 modules
        run: |
          python -m py_compile ml/research_advance_governance_v2.py
          python -m py_compile ml/p9_booking_curve_v1.py
          python -m py_compile ml/p10_pooled_horizon_global_v1.py
      - name: Run governance and leakage regression tests
        run: |
          python -m ml.test_research_advance_governance_v2
          python -m ml.test_p9_booking_curve_v1
          python -m ml.test_p10_pooled_horizon_global_v1
      - name: Verify frozen canonical history bytes
        run: |
          set -euo pipefail
          history_sha=$(sha256sum ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz | awk '{print $1}')
          test "$history_sha" = "3c6b35142c6bd20a484f2aa758cd41284fd6f4c6db1353b138f81cf321161569"
      - name: Run real five-season P10 pooled-vs-local benchmark
        run: |
          set -euo pipefail
          python -m ml.p10_pooled_horizon_global_v1 \
            --canonical-history ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output-json /tmp/p10-scorecard.json \
            --predictions-csv /tmp/p10-predictions.csv \
            --fold-manifest /tmp/p10-fold-manifest.json
      - name: Validate fail-closed research governance
        run: |
          set -euo pipefail
          jq -e '
            .version == "p10-pooled-horizon-global-v1"
            and .evidence_class == "historical_exposed_research"
            and .production_change == false
            and .live_adjustment == 0
            and .match_blocking == true
            and .fold_count == 3
            and .governance_v2.robust_advance_allowed == false
            and (.governance_v2.reason_codes | index("business_meaningful_mae_threshold_not_defined") != null)
          ' /tmp/p10-scorecard.json >/dev/null
      - name: Print P10 headline result
        run: |
          jq '{matches,eligible_rows,local_match_balanced_mae,pooled_match_balanced_mae,delta_mae,event_improvement_rate,fold_improvement_rate,uncertainty,governance_v2}' /tmp/p10-scorecard.json
      - name: Upload P10 historical research evidence
        uses: actions/upload-artifact@v4
        with:
          name: p10-pooled-horizon-v1-${{ github.run_id }}
          path: |
            /tmp/p10-scorecard.json
            /tmp/p10-predictions.csv
            /tmp/p10-fold-manifest.json
          if-no-files-found: error
          retention-days: 90
