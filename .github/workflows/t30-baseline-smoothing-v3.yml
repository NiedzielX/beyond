name: T30 Baseline Smoothing v3

on:
  pull_request:
    paths:
      - "ml/t30_baseline_smoothing_v3.py"
      - ".github/workflows/t30-baseline-smoothing-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-origin-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile v3 experiment
        run: python -m py_compile ml/t30_baseline_smoothing_v3.py

      - name: Run rolling-origin pre-validation gate
        run: |
          python -m ml.t30_baseline_smoothing_v3 \
            --historical-runtime ml/artifacts/structural_prior_runtime_v1/historical_runtime_v1.csv.gz \
            --output /tmp/t30-baseline-smoothing-v3.json

      - name: Print decision summary
        run: |
          jq '{experiment,hypothesis,governance,control,best,passing_candidate_count,best_passing_candidate,decision}' \
            /tmp/t30-baseline-smoothing-v3.json
