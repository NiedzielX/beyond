name: C1 Synthetic Trajectory Validation v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ml/c1_synthetic_trajectory_validation_v1.py"
      - "ml/C1_SYNTHETIC_TRAJECTORY_VALIDATION_V1.md"
      - "ml/DEMAND_FORECAST_DEVELOPMENT_PLAN_V2.md"
      - "supabase/functions/c1_alpha_training_export_v1/**"
      - ".github/workflows/c1-synthetic-trajectory-validation-v1.yml"
  pull_request:
    paths:
      - "ml/c1_synthetic_trajectory_validation_v1.py"
      - "ml/C1_SYNTHETIC_TRAJECTORY_VALIDATION_V1.md"
      - "ml/DEMAND_FORECAST_DEVELOPMENT_PLAN_V2.md"
      - ".github/workflows/c1-synthetic-trajectory-validation-v1.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: c1-synthetic-trajectory-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Validate code
        run: python -m py_compile ml/c1_synthetic_trajectory_validation_v1.py

  experiment:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Request C1 training OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-c1-alpha-training")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "C1_ALPHA_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Fetch current C1 training payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $C1_ALPHA_OIDC_TOKEN" \
            'https://adchzwqboeekhokapxqi.supabase.co/functions/v1/c1_alpha_training_export_v1' \
            -o /tmp/c1-alpha-training.json
          jq -e '.ok == true' /tmp/c1-alpha-training.json >/dev/null
          jq '{version,eventCount,liveRowCount,sampling}' /tmp/c1-alpha-training.json

      - name: Run train-only synthetic trajectory validation
        run: |
          python -m ml.c1_synthetic_trajectory_validation_v1 \
            --input /tmp/c1-alpha-training.json \
            --artifact-dir ml/artifacts/structural_prior_runtime_v1 \
            --output /tmp/c1-synthetic-trajectory-validation-v1.json

      - name: Print result summary
        run: |
          jq '{experiment,event_count,real_row_count,loeo:[.loeo[]|{profile,event_count,prior_window_mae,model_window_mae,prior_latest_mae,model_latest_mae,worst_event_degradation}],walk_forward:[.chronological_walk_forward[]|{profile,event_count,prior_window_mae,model_window_mae,prior_latest_mae,model_latest_mae}],decision}' \
            /tmp/c1-synthetic-trajectory-validation-v1.json

      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: c1-synthetic-trajectory-validation-v1-${{ github.run_id }}
          path: /tmp/c1-synthetic-trajectory-validation-v1.json
          if-no-files-found: error
          retention-days: 30
