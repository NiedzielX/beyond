name: d2 Stage2 Reliability Gating v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/d2_stage2_reliability_gating_v1.py"
      - "ml/test_d2_stage2_reliability_gating_v1.py"
      - "ml/D2_STAGE2_RELIABILITY_GATING_V1.md"
      - "ml/d2_stage1_model_tournament_v1.py"
      - "ml/d2_stage1_payload_split_v1.py"
      - "ml/d2_live_replay_anchor_v1.py"
      - "ml/run_d2_live_replay_anchor_v1.py"
      - "ml/artifacts/d2_stage0_capacity_audit_v1.json"
      - "ml/artifacts/pre_live_v2_historical_candidate_v1/manifest.json"
      - "ml/artifacts/c1_shadow_v8/training_contract_v1.json"
      - ".github/workflows/d2-stage2-reliability-gating-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ml/d2_stage2_reliability_gating_v1.py"
      - "ml/test_d2_stage2_reliability_gating_v1.py"
      - "ml/D2_STAGE2_RELIABILITY_GATING_V1.md"
      - "ml/d2_stage1_model_tournament_v1.py"
      - "ml/d2_stage1_payload_split_v1.py"
      - "ml/d2_live_replay_anchor_v1.py"
      - "ml/run_d2_live_replay_anchor_v1.py"
      - "ml/artifacts/d2_stage0_capacity_audit_v1.json"
      - "ml/artifacts/pre_live_v2_historical_candidate_v1/manifest.json"
      - "ml/artifacts/c1_shadow_v8/training_contract_v1.json"
      - ".github/workflows/d2-stage2-reliability-gating-v1.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: d2-stage2-reliability-gating-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned core runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Compile Stage 2
        run: |
          python -m py_compile ml/d2_stage2_reliability_gating_v1.py
          python -m py_compile ml/test_d2_stage2_reliability_gating_v1.py
          python -m py_compile ml/d2_stage1_model_tournament_v1.py
          python -m py_compile ml/d2_stage1_payload_split_v1.py
          python -m py_compile ml/d2_live_replay_anchor_v1.py
          python -m py_compile ml/run_d2_live_replay_anchor_v1.py

      - name: Unit / leakage / policy-contract checks
        run: |
          python -m ml.test_d2_stage2_reliability_gating_v1
          python -m ml.test_d2_stage1_payload_split_v1

  evaluate-main:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned core runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Request existing C1 training OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --retry 4 --retry-all-errors --retry-delay 2 -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=beyond-c1-alpha-training")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "C1_ALPHA_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Fetch current append-only C1 replay exports
        shell: bash
        run: |
          set -euo pipefail
          base='https://adchzwqboeekhokapxqi.supabase.co/functions/v1/c1_alpha_training_export_v1'

          fetch_export() {
            local version="$1"
            local output="$2"
            local attempts=5
            local attempt=1
            local code=''
            while [ "$attempt" -le "$attempts" ]; do
              code=$(curl -sS \
                --connect-timeout 20 \
                --max-time 90 \
                -H "Authorization: Bearer $C1_ALPHA_OIDC_TOKEN" \
                -o "$output" \
                -w '%{http_code}' \
                "$base?version=$version" || true)
              if [ "$code" = "200" ] && jq -e '.ok == true' "$output" >/dev/null 2>&1; then
                echo "Fetched $version on attempt $attempt"
                return 0
              fi
              echo "C1 export attempt $attempt/$attempts failed version=$version http=$code" >&2
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
            echo "C1 export failed after $attempts attempts version=$version last_http=$code" >&2
            return 1
          }

          for part in events attendance sporting aliases; do
            fetch_export "v7-$part" "/tmp/c1-$part.json"
          done
          fetch_export "v7-final24" /tmp/c1-final24.json

          jq -c '{ok,eventCount,liveRowCount,liveRowsLength:(.liveRows | length)}' /tmp/c1-final24.json

      - name: Reconstruct exact Stage-2 development split and reserve new holdouts
        run: |
          python -m ml.d2_stage1_payload_split_v1 \
            --events /tmp/c1-events.json \
            --attendance /tmp/c1-attendance.json \
            --sporting /tmp/c1-sporting.json \
            --aliases /tmp/c1-aliases.json \
            --live /tmp/c1-final24.json \
            --training-contract ml/artifacts/c1_shadow_v8/training_contract_v1.json \
            --output-frozen /tmp/d2-stage2-frozen-input.json \
            --output-split-manifest /tmp/d2-stage2-split-manifest.json

      - name: Hard development/holdout contamination gate
        run: |
          jq -e '
            .frozen_development.event_count == 9
            and .frozen_development.live_row_count == 30
            and .rules.new_holdouts_used_for_stage1_selection == false
            and (.new_holdout_candidates.event_ids | index(5)) != null
          ' /tmp/d2-stage2-split-manifest.json >/dev/null
          jq -e '.eventCount == 9 and .liveRowCount == 30' /tmp/d2-stage2-frozen-input.json >/dev/null

      - name: Rebuild exact Frozen Pre-Live v2 Stage 0 anchor
        run: |
          python -m ml.run_d2_live_replay_anchor_v1 \
            --input /tmp/d2-stage2-frozen-input.json \
            --structural-artifact-dir ml/artifacts/structural_prior_runtime_v1 \
            --freeze-manifest ml/artifacts/pre_live_v2_historical_candidate_v1/manifest.json \
            --c1-training-contract ml/artifacts/c1_shadow_v8/training_contract_v1.json \
            --capacity-audit ml/artifacts/d2_stage0_capacity_audit_v1.json \
            --output-json /tmp/d2-stage0-anchor.json \
            --output-csv /tmp/d2-stage0-anchor.csv

      - name: Hard Stage 0 lineage gate
        run: |
          jq -e '
            .status == "FROZEN_V2_EXACT_COMPATIBILITY_READY"
            and .dataset.event_count == 9
            and .dataset.row_count == 30
            and .dataset.all_rows_exact_frozen_v2_anchor == true
          ' /tmp/d2-stage0-anchor.json >/dev/null

      - name: Run Stage 2 reliability / tail-risk tournament
        run: |
          python -m ml.d2_stage2_reliability_gating_v1 \
            --input-csv /tmp/d2-stage0-anchor.csv \
            --output-json /tmp/d2-stage2-reliability-gating-v1.json \
            --output-predictions-csv /tmp/d2-stage2-reliability-gating-v1-predictions.csv

      - name: Hard Stage 2 evidence gate
        run: |
          jq -e '
            .status == "COMPLETED_RELIABILITY_TOURNAMENT"
            and .production_change == false
            and .promotion_allowed == false
            and .stage1_expert_id == "ridge-a10"
            and .stage1_expert_retuned == false
            and .event_count == 9
            and .row_count == 30
            and .reserved_holdout_event_id == 5
            and .reserved_holdout_used_for_selection == false
            and (.development_event_ids | index(5)) == null
            and (.policies | length) == 6
          ' /tmp/d2-stage2-reliability-gating-v1.json >/dev/null

      - name: Print Stage 2 decision and leaderboard
        run: |
          jq '{decision,selected_policy_id,stage2_policy_advanced,eligible_policy_ids,policies:[.policies[]|{policy_id,latest_mae:.scorecard.latest_row_mae,window_mae:.scorecard.event_balanced_window_mae,latest_uplift:.scorecard.latest_mae_improvement,window_uplift:.scorecard.window_mae_improvement,worst_degradation:.scorecard.worst_latest_event_degradation,p90_degradation:.scorecard.p90_latest_event_degradation,mean_reliability:.scorecard.mean_reliability,retained_latest_uplift_share,worst_degradation_reduction_share}]}' \
            /tmp/d2-stage2-reliability-gating-v1.json

      - name: Hash Stage 2 evidence
        run: |
          sha256sum /tmp/d2-stage2-split-manifest.json
          sha256sum /tmp/d2-stage0-anchor.json
          sha256sum /tmp/d2-stage0-anchor.csv
          sha256sum /tmp/d2-stage2-reliability-gating-v1.json
          sha256sum /tmp/d2-stage2-reliability-gating-v1-predictions.csv

      - name: Upload Stage 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-stage2-reliability-gating-v1-${{ github.run_id }}
          path: |
            /tmp/d2-stage2-split-manifest.json
            /tmp/d2-stage0-anchor.json
            /tmp/d2-stage0-anchor.csv
            /tmp/d2-stage2-reliability-gating-v1.json
            /tmp/d2-stage2-reliability-gating-v1-predictions.csv
          if-no-files-found: error
          retention-days: 90
