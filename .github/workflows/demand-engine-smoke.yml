name: Demand Engine Smoke

on:
  push:
    paths:
      - 'ml/demand_engine/**'
      - 'ml/recovered/v17/**'
      - 'ml/live_benchmark_v02.py'
      - 'ml/live_benchmark_v03.py'
      - 'ml/export_v13_predictions.py'
      - '.github/workflows/demand-engine-smoke.yml'
  pull_request:
    paths:
      - 'ml/demand_engine/**'
      - 'ml/recovered/v17/**'
      - 'ml/live_benchmark_v02.py'
      - 'ml/live_benchmark_v03.py'
      - 'ml/export_v13_predictions.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib

      - name: Run Demand Engine unit tests
        run: python -m unittest discover -s ml/demand_engine -p 'test_*.py' -v

      - name: Verify recovered v1.7 strict benchmark evidence
        run: python ml/recovered/v17/verify_recovered_bundle.py

      - name: Verify exact v1.7 T-7 runtime from repo-only evidence
        run: python -m ml.recovered.v17.verify_t7_runtime

      - name: Compile benchmark, runtime and forensic entry points
        run: |
          python -m py_compile ml/demand_engine/benchmark_residual_v1.py
          python -m py_compile ml/demand_engine/benchmark_calibration_v1.py
          python -m py_compile ml/demand_engine/v17_t7.py
          python -m py_compile ml/demand_engine/t7_state.py
          python -m py_compile ml/demand_engine/storage.py
          python -m py_compile ml/demand_engine/supabase.py
          python -m py_compile ml/demand_engine/run_v17_t7_shadow.py
          python -m py_compile ml/recovered/v17/reconstruct_t30_v17.py
          python -m py_compile ml/recovered/v17/reconstruct_t7_v17.py
          python -m py_compile ml/recovered/v17/t7_bundle.py
          python -m py_compile ml/recovered/v17/verify_t7_runtime.py
          python -m py_compile ml/live_benchmark_v02.py
          python -m py_compile ml/live_benchmark_v03.py
          python -m py_compile ml/export_v13_predictions.py
