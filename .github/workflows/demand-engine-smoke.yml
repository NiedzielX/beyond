name: Demand Engine Smoke

on:
  push:
    paths:
      - 'ml/demand_engine/**'
      - 'ml/live_benchmark_v02.py'
      - '.github/workflows/demand-engine-smoke.yml'
  pull_request:
    paths:
      - 'ml/demand_engine/**'
      - 'ml/live_benchmark_v02.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0

      - name: Run Demand Engine contract tests
        run: python -m unittest ml.demand_engine.test_engine -v

      - name: Compile benchmark entry points
        run: |
          python -m py_compile ml/demand_engine/benchmark_residual_v1.py
          python -m py_compile ml/demand_engine/benchmark_calibration_v1.py
          python -m py_compile ml/live_benchmark_v02.py
