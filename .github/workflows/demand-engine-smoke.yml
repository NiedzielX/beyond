name: Demand Engine Smoke

on:
  push:
    paths:
      - 'ml/demand_engine/**'
      - 'ml/run_trajectory_lane_b_v1.py'
      - 'ml/run_daily_inventory_path_v1.py'
      - 'ml/test_run_daily_inventory_path_v1.py'
      - 'ml/run_daily_inventory_path_cycle_v1.py'
      - 'ml/test_run_daily_inventory_path_cycle_v1.py'
      - 'ml/run_daily_inventory_path_gateway_v1.py'
      - 'ml/features/structural_prior_feature_store_v1.py'
      - 'ml/structural_prior_runtime_benchmark_v1.py'
      - 'ml/mae01_incumbent_error_audit_v1.py'
      - 'ml/test_mae01_incumbent_error_audit_v1.py'
      - 'ml/mae02_seat_weighted_median_v1.py'
      - 'ml/test_mae02_seat_weighted_median_v1.py'
      - 'ml/mae03_context_evidence_audit_v1.py'
      - 'ml/test_mae03_context_evidence_audit_v1.py'
      - 'ml/start_daily_inventory_path_watcher_v1.py'
      - 'ml/test_start_daily_inventory_path_watcher_v1.py'
      - 'ml/frozen_window_guardian_v1.py'
      - 'ml/test_frozen_window_guardian_v1.py'
      - 'ml/daily_inventory_source_state_features_v2.py'
      - 'ml/test_daily_inventory_source_state_features_v2.py'
      - 'ml/daily_path_prefix_diagnostics_v1.py'
      - 'ml/test_daily_path_prefix_diagnostics_v1.py'
      - 'ml/recovered/v17/**'
      - 'ml/live_benchmark_v02.py'
      - 'ml/live_benchmark_v03.py'
      - 'ml/export_v13_predictions.py'
      - '.github/workflows/demand-engine-smoke.yml'
  pull_request:
    paths:
      - 'ml/demand_engine/**'
      - 'ml/run_trajectory_lane_b_v1.py'
      - 'ml/run_daily_inventory_path_v1.py'
      - 'ml/test_run_daily_inventory_path_v1.py'
      - 'ml/run_daily_inventory_path_cycle_v1.py'
      - 'ml/test_run_daily_inventory_path_cycle_v1.py'
      - 'ml/run_daily_inventory_path_gateway_v1.py'
      - 'ml/features/structural_prior_feature_store_v1.py'
      - 'ml/structural_prior_runtime_benchmark_v1.py'
      - 'ml/mae01_incumbent_error_audit_v1.py'
      - 'ml/test_mae01_incumbent_error_audit_v1.py'
      - 'ml/mae02_seat_weighted_median_v1.py'
      - 'ml/test_mae02_seat_weighted_median_v1.py'
      - 'ml/mae03_context_evidence_audit_v1.py'
      - 'ml/test_mae03_context_evidence_audit_v1.py'
      - 'ml/start_daily_inventory_path_watcher_v1.py'
      - 'ml/test_start_daily_inventory_path_watcher_v1.py'
      - 'ml/frozen_window_guardian_v1.py'
      - 'ml/test_frozen_window_guardian_v1.py'
      - 'ml/daily_inventory_source_state_features_v2.py'
      - 'ml/test_daily_inventory_source_state_features_v2.py'
      - 'ml/daily_path_prefix_diagnostics_v1.py'
      - 'ml/test_daily_path_prefix_diagnostics_v1.py'
      - 'ml/recovered/v17/**'
      - 'ml/live_benchmark_v02.py'
      - 'ml/live_benchmark_v03.py'
      - 'ml/export_v13_predictions.py'
      - '.github/workflows/demand-engine-smoke.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib

      - name: Run Demand Engine unit tests
        run: python -m unittest discover -s ml/demand_engine -p 'test_*.py' -v

      - name: Verify daily inventory path CLI and local ledger lifecycle
        run: python -m unittest ml.test_run_daily_inventory_path_v1 ml.test_run_daily_inventory_path_cycle_v1 -v

      - name: Verify equal-event error accounting and historical diagnostic guards
        run: python -m unittest ml.test_mae01_incumbent_error_audit_v1 -v

      - name: Reproduce fixed incumbent season errors without saving models
        run: python -m ml.mae01_incumbent_error_audit_v1 --output "$RUNNER_TEMP/mae01-incumbent-audit"

      - name: Verify isolated objective weighting and precommitted stop rule
        run: python -m unittest ml.test_mae02_seat_weighted_median_v1 -v

      - name: Reproduce the fixed seat-weighted development diagnostic
        run: python -m ml.mae02_seat_weighted_median_v1 --output "$RUNNER_TEMP/mae02-seat-weighted"

      - name: Verify context evidence timing, source isolation and grouped variance
        run: python -m unittest ml.test_mae03_context_evidence_audit_v1 -v

      - name: Verify bounded detached worker lifecycle and health
        run: python -m unittest ml.test_start_daily_inventory_path_watcher_v1 -v

      - name: Verify legal-window guardian and no-backfill routing
        run: python -m unittest ml.test_frozen_window_guardian_v1 -v

      - name: Verify independent source-state feature masks and receipt time
        run: python -m unittest ml.test_daily_inventory_source_state_features_v2 -v

      - name: Verify descriptive prefix groups preserve primary event-balanced MAE
        run: python -m unittest ml.test_daily_path_prefix_diagnostics_v1 -v

      - name: Verify recovered v1.7 strict benchmark evidence
        run: python ml/recovered/v17/verify_recovered_bundle.py

      - name: Verify exact v1.7 T-7 runtime from repo-only evidence
        run: python -m ml.recovered.v17.verify_t7_runtime

      - name: Compile benchmark, runtime and forensic entry points
        run: |
          python -m py_compile ml/demand_engine/benchmark_residual_v1.py
          python -m py_compile ml/demand_engine/benchmark_calibration_v1.py
          python -m py_compile ml/demand_engine/v17_t7.py
          python -m py_compile ml/demand_engine/t7_state.py
          python -m py_compile ml/demand_engine/storage.py
          python -m py_compile ml/demand_engine/supabase.py
          python -m py_compile ml/demand_engine/live_trajectory_feature_store.py
          python -m py_compile ml/demand_engine/daily_trajectory_dataset.py
          python -m py_compile ml/demand_engine/trajectory_feature_contract_v1.py
          python -m py_compile ml/demand_engine/trajectory_validation_folds_v1.py
          python -m py_compile ml/demand_engine/trajectory_shared_dataset_v1.py
          python -m py_compile ml/demand_engine/trajectory_lane_a_v1.py
          python -m py_compile ml/demand_engine/trajectory_lane_b_v1.py
          python -m py_compile ml/run_trajectory_lane_b_v1.py
          python -m py_compile ml/demand_engine/structural_prior_runtime.py
          python -m py_compile ml/demand_engine/run_v17_t7_shadow.py
          python -m py_compile ml/features/structural_prior_feature_store_v1.py
          python -m py_compile ml/structural_prior_runtime_benchmark_v1.py
          python -m py_compile ml/recovered/v17/reconstruct_t30_v17.py
          python -m py_compile ml/recovered/v17/reconstruct_t7_v17.py
          python -m py_compile ml/recovered/v17/t7_bundle.py
          python -m py_compile ml/recovered/v17/verify_t7_runtime.py
          python -m py_compile ml/live_benchmark_v02.py
          python -m py_compile ml/live_benchmark_v03.py
          python -m py_compile ml/export_v13_predictions.py
