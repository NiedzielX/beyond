    role: current_live_incumbent_reference
    status: active_via_stored_forecasts
    method: fixed_width_heuristic
    notes: >-
      Current stored v0.2/v0.3 P10/P90 behave approximately like P50 +/- 11756,
      with the upper bound capped by stadium capacity. Treat as unverified legacy
      interval semantics, not a calibrated probability statement.

  - id: split-conformal-80-v1
    role: candidate_framework
    implementation: absolute_residual_split_conformal
    status: code_ready_not_promoted
    target_coverage_pct: 80
    notes: >-
      Engine integration and benchmark harness are implemented. Activation is
      model-specific and requires calibration errors from the same point model
      and forecasting protocol.

