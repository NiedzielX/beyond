registry_version: 3
updated_at: 2026-10-09

historical_models:
  - id: lech-v13-early-seasonality
    role: incumbent_reference
    implementation: sklearn_gradient_boosting
    status: reproducible
    scope: lech
    notes: >-
      Historical incumbent used by current live v0.3 records. Reproduced in the
      benchmark harness; not considered a long-term moat.

  - id: lech-v17-horizon-specific
    role: shadow_candidate
    implementation: ridge_horizon_specific
    status: source_recovery_required
    scope: lech
    horizons:
      - T-30
      - T-7
    notes: >-
      Later historical R&D artifacts exist for T30/T7, but the exact final
      selection/production source has not yet been recovered. Do not reimplement
      by inference and do not promote until reproducible.

  - id: catboost-v01
    role: rejected_challenger
    implementation: catboost
    status: benchmarked_not_promoted
    scope: lech
    notes: >-
      Improved the share within ±10% on the untouched holdout but worsened
      holdout MAE/WAPE and materially increased negative bias versus GB v1.3.

live_corrections:
  - id: live-correction-noop-v1
    role: champion_safe_default
    implementation: deterministic_zero_adjustment
    status: active_shadow
    adjustment: 0
    notes: >-
      Records live features in shadow mode but cannot change the historical
      forecast. This is the only active Demand Engine v1 correction.

  - id: ridge-residual-v1
    role: challenger
    implementation: sklearn_ridge
    status: awaiting_minimum_sample
    minimum_independent_matches: 20
    split_protocol: group_by_ticket_event_id

  - id: gradient-boosting-residual-v1
    role: challenger
    implementation: sklearn_gradient_boosting
    status: awaiting_minimum_sample
    minimum_independent_matches: 20
    split_protocol: group_by_ticket_event_id

interval_calibrators:
  - id: legacy-fixed-width-unverified
    role: incumbent_reference
    status: active_via_stored_forecasts
    method: fixed_width_heuristic
    notes: >-
      Current stored v0.2/v0.3 P10/P90 behave approximately like P50 +/- 11756,
      with the upper bound capped by stadium capacity. Treat as unverified legacy
      interval semantics, not a calibrated probability statement.

  - id: split-conformal-80-v1
    role: candidate_framework
    implementation: absolute_residual_split_conformal
    status: code_ready_not_promoted
    target_coverage_pct: 80
    notes: >-
      Engine integration and benchmark harness are implemented. Activation is
      model-specific and requires calibration errors from the same point model
      and forecasting protocol.

  - id: t30-ridge-split-conformal-80-v1
    role: evidence_only
    implementation: absolute_residual_split_conformal
    status: benchmarked_not_active
    point_model: t30_best_direct_ridge_artifact
    calibration_seasons:
      - 2022/2023
      - 2023/2024
    holdout_seasons:
      - 2024/2025
      - 2025/2026
    calibration_rows: 34
    holdout_rows: 34
    radius: 9823.836858085351
    holdout_coverage_pct: 91.176
    holdout_mean_width: 19647.67
    holdout_interval_score_80: 22001.78
    notes: >-
      Better sharpness and interval score than the approximate legacy fixed-width
      heuristic on this T-30 Ridge holdout. It MUST NOT be applied to v1.3/v0.3,
      because calibration must belong to the same point model/protocol.

engine:
  id: beyond-demand-engine-v1
  active_model_version: beyond-demand-engine-v1-shadow
  status: shadow_active
  storage_contract: forecast_observations
  sampling_schedule: '10 */6 * * *'
  production_dashboard_visibility: excluded_by_default
  live_feature_version: live-features-v1
  live_correction: live-correction-noop-v1
  interval_calibrator: noop_preserve_stored_interval

probabilistic_forecast:
  current_interval_method: stored_legacy_interval_unverified
  status: conformal_framework_ready_incumbent_calibration_missing
  target: calibrated_80pct_interval_with_p50
  terminology_note: >-
    P10/P90 database columns may hold calibrated 80% conformal interval bounds;
    lineage must state the interval method because those bounds are not
    necessarily independently trained 0.10/0.90 quantile models.

promotion_policy:
  automatic_promotion: false
  historical_candidate_requirements:
    - MAE
    - MAPE
    - WAPE
    - Bias
    - within_5_pct
    - within_10_pct
    - pinball_p10
    - pinball_p50
    - pinball_p90
    - p10_p90_coverage
  interval_candidate_requirements:
    calibration_source: same_point_model_and_protocol
    target_coverage_pct: 80
    evaluate_on_untouched_holdout: true
    required_metrics:
      - empirical_coverage
      - coverage_gap
      - mean_interval_width
      - pinball_p10
      - pinball_p50
      - pinball_p90
      - interval_score_80
  live_correction_requirements:
    minimum_independent_matches: 20
    split_protocol: group_by_ticket_event_id
    compare_against: live-correction-noop-v1
    required_metrics:
      - MAE
      - MAPE
      - WAPE
      - Bias
      - within_5_pct
      - within_10_pct
      - live_uplift_absolute_error
      - live_uplift_ape_pp
    constraints:
      - no_material_segment_regression
      - no_material_bias_deterioration
      - no_random_snapshot_split
  required_horizons:
    - T-30
    - T-14
    - T-7
    - T-3
    - T-24h
