engine:
  id: beyond-demand-engine-v1
  active_model_version: beyond-demand-engine-v1-shadow
  status: shadow_active
  storage_contract: forecast_observations
  sampling_schedule: '10 */6 * * *'
  production_dashboard_visibility: excluded_by_default
  live_feature_version: live-features-v1
  live_correction: live-correction-noop-v1
  interval_calibrator: noop_preserve_stored_interval
  historical_runtime_source: current_stored_v13_reference
  historical_target_champion: lech-v17-horizon-specific

probabilistic_forecast:
  current_interval_method: stored_legacy_interval_unverified
  status: v17_calibration_benchmarked_runtime_activation_blocked_by_missing_exact_residual_inference
  target: calibrated_80pct_interval_with_p50
  terminology_note: >-
    P10/P90 database columns may hold calibrated 80% conformal interval bounds;
    lineage must state the interval method because those bounds are not
    necessarily independently trained 0.10/0.90 quantile models.

promotion_policy:
  automatic_promotion: false
  historical_candidate_requirements:
    - strict_as_of_protocol
    - MAE
    - MAPE
    - WAPE
    - Bias
    - within_5_pct
    - within_10_pct
    - paired_holdout_evidence
  interval_candidate_requirements:
    calibration_source: same_point_model_and_protocol
    target_coverage_pct: 80
    evaluate_on_untouched_holdout: true
    required_metrics:
      - empirical_coverage
      - coverage_gap
      - mean_interval_width
      - pinball_p10
      - pinball_p50
      - pinball_p90
      - interval_score_80
  live_correction_requirements:
    minimum_independent_matches: 20
    split_protocol: group_by_ticket_event_id
    compare_against: live-correction-noop-v1
    required_metrics:
      - MAE
      - MAPE
      - WAPE
      - Bias
      - within_5_pct
      - within_10_pct
      - live_uplift_absolute_error
      - live_uplift_ape_pp
    constraints:
      - no_material_segment_regression
      - no_material_bias_deterioration
      - no_random_snapshot_split
  required_horizons:
    - T-30
    - T-14
    - T-7
    - T-3
    - T-24h
